// '오늘'·'어제'·'N일 전'·'N주 전' → days 숫자. Web/Mobile 어시스턴트 정렬 공통.
const parseLastUsed = (s) => {
  if (!s) return 9999;
  if (s === '오늘') return 0;
  if (s === '어제') return 1;
  const dayMatch = s.match(/(\d+)일 전/);
  if (dayMatch) return parseInt(dayMatch[1], 10);
  const weekMatch = s.match(/(\d+)주 전/);
  if (weekMatch) return parseInt(weekMatch[1], 10) * 7;
  return 9999;
};

const pickRandomSuggestionFrom = (suggestions, value, onPick) => {
  if (!suggestions || !suggestions.length) return;
  const pool = suggestions.filter(p => p !== value && p?.title !== value);
  const pick = (pool.length ? pool : suggestions)[Math.floor(Math.random() * (pool.length || suggestions.length))];
  onPick(pick);
};

// 파일 업로드 정책 — NW 공통 블랙리스트 (PDF "Ai Studio 파일 업로드 및 파일 생성 정책" 기준)
// signature: 시그니처(libmagic) + 확장자 필터링 — 확장자만 바꿔도 차단
// byName:    확장자만 보고 차단 — 파일명 위조 시 우회 가능
// custom:    어드민 추가 가능 (최대 200개, 도메인 기준 적용)
const FILE_POLICY = {
  signature: ['bat', 'cmd', 'cpl', 'dll', 'ocx', 'exe', 'scr'],
  byName:    ['com', 'js', 'vbs', 'wsf', 'hta'],
  custom:    [],
  maxBytes:  100 * 1024 * 1024, // 기본 100MB (어드민에서 1MB~2GB 단계 선택)
};
const getFileExt = (name) => {
  const i = (name || '').lastIndexOf('.');
  return i < 0 ? '' : name.slice(i + 1).toLowerCase();
};
const checkFile = (file) => {
  const ext = getFileExt(file.name);
  if (FILE_POLICY.signature.includes(ext)) return { ok: false, ext, reason: 'signature' };
  if (FILE_POLICY.byName.includes(ext))    return { ok: false, ext, reason: 'name' };
  if (FILE_POLICY.custom.includes(ext))    return { ok: false, ext, reason: 'custom' };
  if (file.size > FILE_POLICY.maxBytes)    return { ok: false, ext, reason: 'size' };
  return { ok: true, ext };
};
const formatBytes = (bytes) => {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
};

// 여러 제목에서 공통 토큰(2자 이상, 숫자만은 제외) 추출
const findSharedTitleToken = (titles) => {
  if (!titles || titles.length < 2) return null;
  const tokenize = (t) => (t || '').split(/[_\-\s\.]+/).filter(x => x.length >= 2 && !/^\d+$/.test(x));
  const tokenLists = titles.map(tokenize);
  if (tokenLists.some(l => l.length === 0)) return null;
  for (const tok of tokenLists[0]) {
    if (tokenLists.every(arr => arr.includes(tok))) return tok;
  }
  return null;
};

const _hashStr = (s) => { let h = 0; for (let i = 0; i < (s || '').length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0; return Math.abs(h); };
const pickByKey = (arr, key) => arr[_hashStr(key || '') % arr.length];
// 머지 결과 문서의 베이스 타이틀(확장자 없음) — 파일명/미리보기 타이틀 공통 사용
const deriveMergeBaseTitle = (inputs) => {
  const titles = (inputs || []).map(f => cleanInputTitle(f.name)).filter(Boolean);
  if (titles.length === 0) return '통합 보고서';
  const seed = titles.join('|');
  // 1) 공통 토큰이 알려진 주제이면 해당 풀에서 선택
  const shared = findSharedTitleToken(titles);
  if (shared && MERGE_THEME_POOL[shared]) return pickByKey(MERGE_THEME_POOL[shared], seed);
  // 2) 어떤 파일이라도 알려진 주제 키워드를 포함하면 그 풀 사용
  for (const t of titles) {
    for (const k of Object.keys(MERGE_THEME_POOL)) {
      if (t.includes(k)) return pickByKey(MERGE_THEME_POOL[k], seed);
    }
  }
  // 3) 공통 토큰이 있지만 알려진 주제가 아니면 토큰을 활용한 일반 타이틀
  if (shared) return `${shared} 종합 보고서`;
  // 4) fallback — 일반 통합 타이틀
  return pickByKey(MERGE_GENERIC_POOL, seed);
};
// 머지 결과 파일명 — 베이스 타이틀에 hwpx 확장자만 부여 (모드 접미사 없음, 그 자체로 통합 문서)
const deriveMergeFilename = (inputs, mode) => `${deriveMergeBaseTitle(inputs)}.hwpx`;

// 자연어 입력에서 '표준 양식 파일 생성 의도' 감지.
// 단순 콘텐츠 작성 요청(메모/글/현황 등)은 트리거하지 않도록 동사 + 문서 명사 조합 또는
// 명시적 키워드(초안/템플릿)일 때만 true 반환.
const FILE_GEN_VERBS = [
  '만들어', '만들기', '작성해', '작성하기',
  '생성해', '생성하기', '뽑아', '제작',
];
const FILE_GEN_DOC_NOUNS = [
  '보고서', '보고', '보도자료', '계획서', '예산서',
  '회의록', '간담회', '안건지', '일지',
];
const detectFileGenIntent = (text) => {
  if (!text) return false;
  // 1) 명시 키워드 — 즉시 트리거
  if (/초안|템플릿/.test(text)) return true;
  // 2) 생성 동사 + 문서 명사 조합 — 트리거 ('보고'는 부분일치로 '주간보고/월간보고' 등 포괄)
  const hasVerb = FILE_GEN_VERBS.some(k => text.includes(k));
  const hasNoun = FILE_GEN_DOC_NOUNS.some(k => text.includes(k));
  if (hasVerb && hasNoun) return true;
  // 3) 생성 동사 + '파일' 키워드 — 'X 파일 생성/작성/만들어줘'
  if (hasVerb && /파일/.test(text)) return true;
  // 4) 생성 동사 + 개수 — "5개 만들어줘", "10개 만들기" (자유 형식 다수 생성 경로)
  if (hasVerb && /\d+\s*(개|파일|files?)/i.test(text)) return true;
  return false;
};

// 자연어 입력에서 '구체 초안 요청' 감지 — 확장자 + 항목값(필드값)이 모두 명시된 케이스.
// 트리거 시 템플릿 제안을 건너뛰고 바로 파일을 생성한다.
const detectDirectFileDraftIntent = (text) => {
  if (!text) return false;
  const hasExtKeyword = /확장자\s*[:：]/.test(text);
  const hasExt = hasExtKeyword || !!detectOutputExtension(text);
  if (!hasExt) return false;
  const labeled = (text.match(/(^|\n)\s*[\-•·*]?\s*[^:：\n]{1,30}\s*[:：]\s*\S/g) || []).length;
  const tree = (text.match(/(^|\n)\s*[ㄴ└→]/g) || []).length;
  return labeled >= 2 || (labeled >= 1 && tree >= 1) || tree >= 3;
};

// "확장자 : hwpx" 류 명시 표기를 우선 추출 — 본문 내 "w.claude" 같은 오탐 회피용
const extractExplicitExt = (text) => {
  if (!text) return null;
  const m = text.match(/확장자\s*[:：]\s*([a-zA-Z0-9가-힣]{2,10})/);
  if (!m) return null;
  const c = m[1].toLowerCase();
  return EXT_ALIASES[c] || c;
};

// 구체 초안 요청 본문을 메타 필드와 섹션으로 분해
const META_HIDDEN_LABELS = ['확장자', '파일 형식', '파일형식', '형식', 'ext'];
const parseDirectDraftSections = (text) => {
  if (!text) return { meta: [], sections: [] };
  const lines = text.split('\n').map(l => l.replace(/\r$/, ''));
  const meta = [];
  const sections = [];
  let currentSection = null;
  let firstNonEmptySeen = false;
  for (const raw of lines) {
    const t = raw.trim();
    if (!t) continue;
    const labelMatch = t.match(/^[\-•·*]?\s*([^:：\n]{1,30}?)\s*[:：]\s*(.+)$/);
    if (labelMatch && /^[\-•·*]/.test(t)) {
      const label = labelMatch[1].trim();
      const value = labelMatch[2].trim();
      if (!META_HIDDEN_LABELS.some(h => label.toLowerCase() === h.toLowerCase())) {
        meta.push({ label, value });
      }
      currentSection = null;
      firstNonEmptySeen = true;
      continue;
    }
    const treeMatch = t.match(/^[ㄴ└→]\s*(.+)$/);
    if (treeMatch) {
      if (!currentSection) {
        currentSection = { header: '세부 항목', items: [] };
        sections.push(currentSection);
      }
      currentSection.items.push(treeMatch[1].trim());
      firstNonEmptySeen = true;
      continue;
    }
    if (!firstNonEmptySeen && /(초안|작성|해줘|해주세요|만들|생성|아래의\s*내용)/.test(t)) {
      firstNonEmptySeen = true;
      continue;
    }
    currentSection = { header: t, items: [] };
    sections.push(currentSection);
    firstNonEmptySeen = true;
  }
  return { meta, sections };
};

// 자유 형식 출력 확장자 감지 — 블랙리스트 정책 (PDF 1번 영역).
// 차단 확장자 외에는 모두 허용. 한글/영어 별칭 → 정식 확장자로 정규화.
const EXT_ALIASES = {
  // 한글 별칭
  '워드파일': 'docx', '워드': 'docx', '엠에스워드': 'docx',
  '엑셀파일': 'xlsx', '엑셀': 'xlsx',
  '파워포인트': 'pptx', '피피티': 'pptx',
  '한글파일': 'hwpx', '한글': 'hwp',
  '피디에프': 'pdf',
  // 영어 별칭
  'word': 'docx', 'msword': 'docx',
  'excel': 'xlsx',
  'powerpoint': 'pptx',
};
// 사용자 입력에서 확장자 후보를 폭넓게 추출:
//  1) 별칭(한글/영어)을 정식 ext로 매핑
//  2) ".ext" 명시 패턴
//  3) 짧은 영문 단어를 ext 후보로 인정 (블랙리스트 원칙)
const detectOutputExtension = (text) => {
  if (!text) return null;
  for (const [alias, ext] of Object.entries(EXT_ALIASES)) {
    const re = new RegExp(`\\b${alias}\\b`, 'i');
    if (re.test(text)) return ext;
  }
  const dotMatch = text.toLowerCase().match(/\.([a-z0-9]{1,8})\b/);
  if (dotMatch) return dotMatch[1];
  const wordMatch = text.toLowerCase().match(/\b([a-z]{2,8})\b/);
  if (wordMatch) return wordMatch[1];
  return null;
};
// 추출된 ext가 FILE_POLICY 차단 목록에 포함되는지 검사 (출력에도 동일 정책 적용)
const isBlockedExtension = (ext) => {
  if (!ext) return false;
  return FILE_POLICY.signature.includes(ext)
      || FILE_POLICY.byName.includes(ext)
      || (FILE_POLICY.custom || []).includes(ext);
};

// 프롬프트로부터 자유 형식의 필드 셋을 결정.
// hasExt=false면 마지막에 '파일 형식' 필드를 추가해 한 번에 묻는다.
const generateFreeFields = (userPrompt, hasExt) => {
  const text = (userPrompt || '').toString();
  const preset = FREE_FIELD_PRESETS.find(p => p.match.test(text));
  const baseFields = preset ? preset.fields : FREE_FIELDS;
  const fields = [...baseFields];
  if (!hasExt) {
    fields.push({ key: 'ext', label: '파일 형식', placeholder: '예: hwpx / docx / pdf / pptx / xlsx (기본: hwpx)' });
  }
  return { fields, intro: preset ? preset.intro : null };
};

// 사용자 답변에서 필드값 파싱.
//  1) "라벨: 값" 형식이 있으면 그것을 우선 적용
//  2) 라벨이 없으면 줄 순서대로 fields 배열에 매핑
//  3) 빈 칸은 generateTemplateBody에서 샘플로 fallback
const parseFieldAnswer = (text, fields) => {
  if (!text || !fields || !fields.length) return {};
  // 한 줄에 "1. 라벨 값 2. 라벨 값 ..."로 들어온 경우 번호 구분자로 분해, 그 외엔 줄 단위
  let lines;
  if (!/\n/.test(text) && /\d+\s*[\.\)]\s+/.test(text)) {
    lines = text.split(/\s*\d+\s*[\.\)]\s+/).map(s => s.trim()).filter(Boolean);
  } else {
    lines = text.split('\n').map(l => l.replace(/^\s*[0-9]+[\.\)]\s*/, '').trim()).filter(Boolean);
  }
  const values = {};
  for (const line of lines) {
    for (const f of fields) {
      const labelEscaped = f.label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      // 콜론은 있어도/없어도 매칭 — "주제/제목 유가급등 원인" 형태 지원
      const re = new RegExp(`^${labelEscaped}\\s*[:：]?\\s+(.+)$`, 'i');
      const m = line.match(re);
      if (m) values[f.key] = m[1].trim();
    }
  }
  if (Object.keys(values).length === 0 && lines.length > 0) {
    lines.forEach((line, i) => { if (i < fields.length) values[fields[i].key] = line; });
  }
  return values;
};

// 자연어 요청에서 '다중 파일 생성 의도' 감지 — 트리거 시 HWPX/DOCX/PDF 3종 동시 생성
const MULTI_FILE_PATTERNS = [
  /여러\s*(형식|파일|개)/,
  /다양한\s*형식/,
  /다중\s*(형식|파일)/,
  /(묶음|묶어서)/,
  /한번에\s*(여러|다양|모두)/,
];
const detectMultiFileIntent = (text) => {
  if (!text) return false;
  return MULTI_FILE_PATTERNS.some(re => re.test(text));
};

// '숫자 + (개|파일)' 카운트 감지 — "5개 만들어줘", "10개의 파일" 등.
// 2~30 범위만 의미 있는 다중 생성으로 인정.
const detectFileCount = (text) => {
  if (!text) return null;
  const m = text.match(/(\d+)\s*(개|파일|files?)/i);
  if (!m) return null;
  const n = parseInt(m[1], 10);
  return (n >= 2 && n <= 30) ? n : null;
};

// 자연어 요청에서 파일명에 쓸 제목 추출 — 끝의 명령 동사("작성해줘" 등)와 마침 조사 제거
// 예: "주간 보고서 작성해줘" → "주간 보고서"
const FILE_TITLE_TAILS = [
  '작성해 주세요', '작성해주세요', '작성해 줘', '작성해줘', '작성해', '작성하기', '작성',
  '만들어 주세요', '만들어주세요', '만들어 줘', '만들어줘', '만들어', '만들기',
  '생성해 주세요', '생성해주세요', '생성해 줘', '생성해줘', '생성해', '생성하기',
  '해 주세요', '해주세요', '해 줘', '해줘', '부탁해요', '부탁해',
  '초안', '템플릿',
];
const extractFileTitle = (userPrompt) => {
  if (!userPrompt) return null;
  let t = userPrompt.trim();
  // 긴 패턴부터 매칭
  const tails = [...FILE_TITLE_TAILS].sort((a, b) => b.length - a.length);
  for (const k of tails) {
    if (t.endsWith(k)) { t = t.slice(0, -k.length).trim(); break; }
  }
  // 끝 조사 제거 (을/를/은/는/이/가/의)
  t = t.replace(/[을를은는이가의]$/, '').trim();
  if (!t || t.length > 50) return null;
  return t;
};

  const dayMap = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
  const dayIdx = new Date().getDay();
  const day = dayMap[dayIdx];
  const h = new Date().getHours();
  let timeStr = '';
  if (h < 6) timeStr = '늦은 밤이에요';
  else if (h < 12) timeStr = '좋은 아침이에요';
  else if (h < 14) timeStr = '점심 잘 챙기세요';
  else if (h < 18) timeStr = '오후에도 힘내세요';
  else if (h < 22) timeStr = '저녁 시간이네요';
  else timeStr = '오늘도 수고하셨어요';
  return { day, timeStr, name };
};

// 상대 시간 ('오늘'·'어제'·'N일 전'·'N주 전') → 'MM.DD' (오늘 기준: 2026-05-12)
const formatRecentDate = (s) => {
  if (!s) return '';
  let daysAgo = 0;
  if (s.startsWith('오늘')) daysAgo = 0;
  else if (s === '어제') daysAgo = 1;
  else {
    const dayMatch = s.match(/(\d+)일 전/);
    if (dayMatch) daysAgo = parseInt(dayMatch[1], 10);
    else {
      const weekMatch = s.match(/(\d+)주 전/);
      if (weekMatch) daysAgo = parseInt(weekMatch[1], 10) * 7;
    }
  }
  const d = new Date(2026, 4, 12);
  d.setDate(d.getDate() - daysAgo);
  return `${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
};

const WebComposer = ({ value, onChange, onSubmit, model, setModel, activeAssistant, setActiveAssistant, suggestions, onPickSuggestion, chatMode, onToggleScope, scopeOpen }) => {
  const [showModel, setShowModel] = React.useState(false);
  const [showAttach, setShowAttach] = React.useState(false);
  const [showSwitch, setShowSwitch] = React.useState(false);
  const [attachments, setAttachments] = React.useState([]);
  const [fileError, setFileError] = React.useState(null);
  const taRef = React.useRef(null);
  const fileInputRef = React.useRef(null);
  // 자동 높이 조절 — 대화 페이지 한정 (내용에 따라 늘어남, max 320)
  React.useEffect(() => {
    if (!chatMode || !taRef.current) return;
    const ta = taRef.current;
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 320) + 'px';
  }, [value, chatMode]);
  // 파일 에러 토스트 자동 해제
  React.useEffect(() => {
    if (!fileError) return;
    const t = setTimeout(() => setFileError(null), 4000);
    return () => clearTimeout(t);
  }, [fileError]);
  const closeAll = () => { setShowModel(false); setShowAttach(false); setShowSwitch(false); };
  const switchList = buildAssistantSwitchList(8);
  const pickRandomSuggestion = () => pickRandomSuggestionFrom(suggestions, value, onPickSuggestion);
  const currentModel = MODELS.find(m => m.id === (model || 'default')) || MODELS[0];
  // 전송 — 첨부 목록과 함께 부모에 전달, 내부 상태 초기화

    if (!value.trim()) return;
    onSubmit(attachments);
    setAttachments([]);
    setFileError(null);
  };
  // 파일 선택 다이얼로그 호출
  const openFilePicker = () => {
    setShowAttach(false);
    if (fileInputRef.current) {
      fileInputRef.current.value = ''; // 같은 파일 재선택 허용
      fileInputRef.current.click();
    }
  };
  // 파일 검증 + 첨부
  const handleFiles = (filesLike) => {
    const files = Array.from(filesLike || []);
    if (!files.length) return;
    const accepted = [];
    const rejected = [];
    files.forEach(f => {
      const r = checkFile(f);
      if (r.ok) accepted.push({ id: `${Date.now()}-${f.name}-${f.size}`, name: f.name, size: f.size, ext: r.ext });
      else rejected.push({ name: f.name, ext: r.ext, reason: r.reason });
    });
    if (accepted.length) setAttachments(prev => [...prev, ...accepted]);
    if (rejected.length) {
      const first = rejected[0];
      const msgByReason = {
        signature: `보안 정책에 의해 차단된 파일 형식입니다. (.${first.ext})`,
        name:      `보안 정책에 의해 차단된 파일 형식입니다. (.${first.ext})`,
        custom:    `관리자가 차단한 파일 형식입니다. (.${first.ext})`,
        size:      `파일 1개 최대 첨부 용량(${formatBytes(FILE_POLICY.maxBytes)})을 초과했습니다.`,
      };
      const extra = rejected.length > 1 ? ` 외 ${rejected.length - 1}개` : '';
      setFileError((msgByReason[first.reason] || '첨부할 수 없는 파일입니다.') + extra);
    }
  };
  const removeAttachment = (id) => setAttachments(prev => prev.filter(a => a.id !== id));
  return (
    <div className="w-full max-w-2xl lg:max-w-3xl xl:max-w-4xl mx-auto">
      {/* 활성 어시스턴트 chip (입력창 위) — 대화 페이지에서는 숨김 */}

        <div data-feature="active-assistant" className="flex items-center gap-2 mb-2 ml-3">

          <span className="inline-flex items-center gap-1.5 pl-1 pr-2 py-0.5 rounded-full bg-neutral-900 text-white text-[11px] font-medium">
            <span className={`w-4 h-4 rounded-full ${activeAssistant.color} flex items-center justify-center text-[9px]`}>{activeAssistant.icon}</span>
            {activeAssistant.name}
            <button onClick={() => setActiveAssistant(null)}><X className="w-2.5 h-2.5" /></button>
          </span>
        </div>
      )}
      {/* 통합 입력창 — 모델/어시스턴트/검색 데이터 모두 박스 내부 */}
      <div data-feature="composer history-flow" className="bg-white border border-neutral-300 rounded-3xl shadow-sm focus-within:border-neutral-900 transition px-4 pt-3 pb-2">
        {/* 첨부 칩 영역 */}

                <span className="truncate" title={a.name}>{a.name}</span>
                <span className="text-[10px] text-neutral-400 shrink-0">{formatBytes(a.size)}</span>
                <button onClick={() => removeAttachment(a.id)} title="첨부 제거" className="w-4 h-4 rounded-full hover:bg-neutral-200 flex items-center justify-center shrink-0 text-neutral-500">
                  <X className="w-2.5 h-2.5" />

        {/* hidden file input — '파일 업로드' 드롭다운에서 트리거 */}
        <input

        <textarea
          ref={taRef}
          value={value}
          onChange={e => onChange(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); submit(); } }}
          placeholder={chatMode ? '요청 내용 입력 (Enter: 전송, Shift+Enter: 줄바꿈)' : (activeAssistant ? `${activeAssistant.name}에게 메시지 보내기` : '궁금한 점이나 찾고싶은 정보가 있으시면 무엇이든 말씀해 주세요.')}

  const [activeAssistant, setActiveAssistant] = React.useState(null);
  const [scopeOpen, setScopeOpen] = React.useState(false);
  const g = greeting();
  return (
    <div className="flex h-full bg-white">
      <WebSidebar collapsible onGotoAssistants={onGotoAssistants} onResumeChat={onResumeChat} onNewChat={onNewChat} recentChats={recentChats} currentScreen={currentScreen} onStartChatWithAssistant={onStartChatWithAssistant} />
      <main className="flex-1 flex flex-col items-center justify-center px-8 min-w-0">
        <div data-feature="greeting" className="w-full max-w-2xl lg:max-w-3xl xl:max-w-4xl text-center mb-8 px-2">
          <h1 className="text-3xl font-light text-neutral-900 tracking-tight">
            <span className="text-neutral-500">안녕하세요, </span>
            <span className="font-medium">{g.name}님</span>
          </h1>
          <p className="text-sm text-neutral-500 mt-2">무엇을 도와드릴까요?</p>
        </div>
        <div className="w-full max-w-2xl">
          <WebComposer value={val} onChange={setVal}
            onSubmit={(attachments) => { onSubmit(val, activeAssistant, attachments || []); setVal(''); }}
            model={model} setModel={setModel}
            activeAssistant={activeAssistant} setActiveAssistant={setActiveAssistant}
            onToggleScope={() => setScopeOpen(v => !v)} scopeOpen={scopeOpen} />
        </div>
        <p className="text-[11px] text-neutral-400 mt-6">AI는 일부 부정확한 정보를 생성할 수 있습니다.</p>
      </main>
      {scopeOpen && <WebScopePanel />}
    </div>
  );
};


// ====== Flex Message JSON 빌더 ======
// NAVER WORKS Bot Flex Message (LINE Flex 호환) — 각 응답 메시지를 Flex JSON으로 변환.
// 빌더가 반환하는 객체는 그대로 NAVER WORKS Bot API에 전송 가능한 content 구조.
const _fmtKB = (b) => `${(b / 1024).toFixed(1)} KB`;

const buildFlex = (m) => {
  if (m.kind === 'file-result' || m.kind === 'free-file-result' || m.kind === 'file-merge-result' || m.kind === 'direct-file-result') {
    const isMerge = m.kind === 'file-merge-result';
    const files = m.files || (m.file ? [m.file] : []);
    const previewActionId = isMerge ? 'preview-merge' : 'preview';
    const fileRow = (f) => {
      const ext = (f.ext || f.name.split('.').pop() || 'hwpx').toLowerCase();

// ====== Flex JSON Renderer ======
// buildFlex()가 만든 NAVER WORKS Bot Flex JSON을 그대로 시각화. 응답 카드는 직접 React로 그리지 않고
// Flex JSON을 입력으로 받아 이 렌더러가 출력. postback action은 onAction(action)으로 위임 → 컴포저가 dispatch.
const FLEX_TEXT_SIZE = { xxs: 10, xs: 11, sm: 12, md: 14, lg: 16, xl: 18, xxl: 20, '3xl': 24, '4xl': 28, '5xl': 32 };
const FLEX_PAD = { none: 0, xs: 4, sm: 8, md: 12, lg: 16, xl: 24, xxl: 32 };
const FLEX_BUBBLE_W = { nano: 120, micro: 200, kilo: 240, mega: 304, giga: 520 };

const flexPad = (v) => v == null ? undefined : (FLEX_PAD[v] != null ? FLEX_PAD[v] + 'px' : v);
const flexTextSize = (v) => (FLEX_TEXT_SIZE[v] != null ? FLEX_TEXT_SIZE[v] : 14) + 'px';
const flexAlign = (v) => v === 'start' ? 'left' : v === 'end' ? 'right' : v;

const parseFlexPostback = (data) => {
  const out = {};
  (data || '').split('&').forEach(kv => {
    const [k, v] = kv.split('=');
    if (k) out[k] = decodeURIComponent(v || '');
  });
  return out;
};

// 가로 캐러셀 — 스크롤바 숨김 + 양쪽 가장자리 페이드 + 양방향 화살표 인디케이터.
// 스크롤 가능한 방향(좌/우)에 따라 해당 방향 화살표만 노출. 클릭 시 한 카드 폭만큼 smooth scroll.
const FlexCarousel = ({ node, onAction }) => {
  const ref = React.useRef(null);
  const [hasPrev, setHasPrev] = React.useState(false);
  const [hasNext, setHasNext] = React.useState(false);
  React.useEffect(() => {
    const el = ref.current; if (!el) return;
    const check = () => {
      setHasPrev(el.scrollLeft > 4);
      setHasNext(el.scrollLeft + el.clientWidth + 4 < el.scrollWidth);
    };
    check();
    el.addEventListener('scroll', check, { passive: true });
    const ro = new ResizeObserver(check); ro.observe(el);
    return () => { el.removeEventListener('scroll', check); ro.disconnect(); };
  }, [node]);
  const stepSize = () => {
    const el = ref.current; if (!el) return 200;
    const card = el.querySelector('[data-flex-bubble]');
    return (card?.getBoundingClientRect().width || 200) + 10;
  };
  const goNext = () => ref.current?.scrollBy({ left:  stepSize(), behavior: 'smooth' });
  const goPrev = () => ref.current?.scrollBy({ left: -stepSize(), behavior: 'smooth' });
  const arrowBtn = {
    position: 'absolute', top: '50%', transform: 'translateY(-50%)',
    width: 32, height: 32, borderRadius: '50%',
    background: '#171717', color: '#fff', border: 'none', cursor: 'pointer',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    fontSize: 14, fontWeight: 600, boxShadow: '0 2px 8px rgba(0,0,0,0.18)',
    zIndex: 2,
  };
  const fade = (side) => ({
    position: 'absolute', top: 0, bottom: 4, width: 56, pointerEvents: 'none',
    [side]: 0,
    background: `linear-gradient(to ${side === 'left' ? 'right' : 'left'}, rgba(255,255,255,0.95), rgba(255,255,255,0))`,
  });
  return (
    <div style={{ position: 'relative' }}>
      <div ref={ref} className="flex-carousel-track" style={{
        display: 'flex', gap: 10, overflowX: 'auto', paddingBottom: 4,
        scrollSnapType: 'x mandatory', scrollBehavior: 'smooth',
      }}>
        {(node.contents || []).map((c, i) => (
          <div key={i} data-flex-bubble style={{ scrollSnapAlign: 'start', display: 'flex', flex: '0 0 auto' }}>
            <FlexNode node={c} onAction={onAction} />
          </div>
        ))}
      </div>
      {hasPrev && (
        <>
          <div style={fade('left')} />
          <button onClick={goPrev} aria-label="이전 카드 보기" style={{ ...arrowBtn, left: 4 }}>‹</button>
        </>
      )}
      {hasNext && (
        <>
          <div style={fade('right')} />
          <button onClick={goNext} aria-label="다음 카드 보기" style={{ ...arrowBtn, right: 4 }}>›</button>
        </>
      )}
    </div>
  );
};

const FlexNode = ({ node, onAction }) => {
  if (!node) return null;
  const type = node.type;
  if (type === 'bubble') {
    const w = FLEX_BUBBLE_W[node.size] || FLEX_BUBBLE_W.mega;
    const st = node.styles || {};
    const borderless = !!node.borderless;
    const sect = (k, pad = true) => ({
      padding: pad ? 14 : 0,
      borderBottom: k === 'header' && st.header?.separator ? `1px solid ${st.header?.separatorColor || '#e5e5e5'}` : undefined,
      borderTop:    k === 'footer' && st.footer?.separator ? `1px solid ${st.footer?.separatorColor || '#e5e5e5'}` : undefined,
      background: st[k]?.backgroundColor,
    });
    return (
      <div style={{
        width: w, flex: '0 0 auto', minWidth: 0,
        background: borderless ? 'transparent' : '#fff',
        border: borderless ? 'none' : '1px solid #e5e5e5',
        borderRadius: borderless ? 0 : 14,
        overflow: 'hidden',
        display: 'flex', flexDirection: 'column',
        boxShadow: borderless ? 'none' : '0 1px 2px rgba(0,0,0,0.04)',
      }}>
        {node.header && <div style={sect('header')}><FlexNode node={node.header} onAction={onAction} /></div>}
        {node.hero   && <div style={sect('hero', false)}><FlexNode node={node.hero} onAction={onAction} /></div>}
        {node.body   && <div style={{ ...sect('body'), flex: 1 }}><FlexNode node={node.body} onAction={onAction} /></div>}
        {node.footer && <div style={sect('footer')}><FlexNode node={node.footer} onAction={onAction} /></div>}
      </div>
    );
  }
  if (type === 'carousel') {
    return <FlexCarousel node={node} onAction={onAction} />;
  }
  if (type === 'box') {
    const layout = node.layout || 'vertical';
    const baseline = layout === 'baseline';
    const dir = (layout === 'horizontal' || baseline) ? 'row' : 'column';
    const onClick = node.action && onAction ? (e) => { e.stopPropagation(); onAction(node.action); } : undefined;
    return (
      <div style={{
        display: 'flex',
        flexDirection: dir,
        alignItems: baseline ? 'baseline' : (node.alignItems || 'stretch'),
        justifyContent: node.justifyContent || 'flex-start',
        gap: flexPad(node.spacing),
        marginTop: flexPad(node.margin),
        padding: flexPad(node.paddingAll),
        paddingTop: flexPad(node.paddingTop),
        paddingBottom: flexPad(node.paddingBottom),
        paddingLeft: flexPad(node.paddingStart),
        paddingRight: flexPad(node.paddingEnd),
        background: node.backgroundColor,
        borderColor: node.borderColor,
        borderStyle: node.borderColor ? 'solid' : undefined,
        borderWidth: node.borderColor ? '1px' : undefined,
        borderRadius: flexPad(node.cornerRadius),
        width: node.width,
        height: node.height,
        flex: node.flex,
        cursor: onClick ? 'pointer' : undefined,
        boxSizing: 'border-box',
        minWidth: 0,
      }} onClick={onClick}>
        {(node.contents || []).map((c, i) => <FlexNode key={i} node={c} onAction={onAction} />)}
      </div>
    );
  }
  if (type === 'text') {
    const onClick = node.action && onAction ? (e) => { e.stopPropagation(); onAction(node.action); } : undefined;
    const style = {
      fontSize: flexTextSize(node.size),
      color: node.color || '#171717',
      fontWeight: node.weight === 'bold' ? 700 : 400,
      fontStyle: node.style === 'italic' ? 'italic' : 'normal',
      textDecoration: node.decoration === 'underline' ? 'underline' : (node.decoration === 'line-through' ? 'line-through' : 'none'),
      textAlign: flexAlign(node.align),
      flex: node.flex,
      marginTop: flexPad(node.margin),
      marginLeft: flexPad(node.margin) && node.align == null ? undefined : undefined,
      cursor: onClick ? 'pointer' : undefined,
      lineHeight: 1.45,
      minWidth: 0,
    };
    if (node.maxLines) {
      style.display = '-webkit-box';
      style.WebkitBoxOrient = 'vertical';
      style.WebkitLineClamp = node.maxLines;
      style.overflow = 'hidden';
      style.wordBreak = 'break-word';
    } else if (node.wrap === false) {
      style.whiteSpace = 'nowrap';
      style.overflow = 'hidden';
      style.textOverflow = 'ellipsis';
    } else if (node.wrap) {
      style.whiteSpace = 'pre-wrap';
      style.wordBreak = 'break-word';
    }
    const content = (node.contents && node.contents.length > 0)
      ? node.contents.map((s, i) => (
          <span key={i} style={{
            fontSize: s.size ? flexTextSize(s.size) : 'inherit',
            color: s.color || 'inherit',
            fontWeight: s.weight === 'bold' ? 700 : 'inherit',
            fontStyle: s.style === 'italic' ? 'italic' : 'inherit',
            textDecoration: s.decoration || 'inherit',
          }}>{s.text}</span>
        ))
      : node.text;
    return <div style={style} onClick={onClick}>{content}</div>;
  }
  if (type === 'button') {
    const a = node.action || {};
    const isPrimary = node.style === 'primary';
    const isLink = node.style === 'link';
    const h = node.height === 'sm' ? 30 : 40;
    return (
      <button onClick={(e) => { e.stopPropagation(); onAction && onAction(a); }} style={{
        height: h, padding: '0 14px',
        borderRadius: 10,
        border: (isPrimary || isLink) ? 'none' : '1px solid #d4d4d4',
        background: isPrimary ? (node.color || '#171717') : (isLink ? 'transparent' : '#fff'),
        color: isPrimary ? '#fff' : (node.color || (isLink ? '#1d4ed8' : '#404040')),
        fontSize: 12, fontWeight: 600,
        flex: node.flex,
        marginTop: flexPad(node.margin),
        cursor: 'pointer',
        whiteSpace: 'nowrap',
      }}>{a.label || ''}</button>
    );
  }
  if (type === 'separator') {
    return <div style={{
      height: 1, alignSelf: 'stretch', flexShrink: 0,
      background: node.color || '#e5e5e5',
      marginTop: flexPad(node.margin),
      marginBottom: flexPad(node.margin),
    }} />;
  }
  if (type === 'filler') {
    return <div style={{ flex: node.flex || 1 }} />;
  }
  if (type === 'image') {
    return <img src={node.url} alt="" style={{
      maxWidth: '100%',
      objectFit: node.aspectMode === 'fit' ? 'contain' : 'cover',
      marginTop: flexPad(node.margin),
      flex: node.flex,
    }} />;
  }
  if (type === 'icon') {
    return <span style={{ fontSize: flexTextSize(node.size), marginLeft: flexPad(node.margin), display: 'inline-block' }}>{node.url}</span>;
  }
  return null;
};

const FlexRenderer = ({ flex, onAction }) => {
  if (!flex || !flex.contents) return null;
  return <FlexNode node={flex.contents} onAction={onAction} />;
};

// Web 파일 병합 — Flex 카드 위에 표시되는 설명 블록 (병합 방식 + 결과물).
// 실제 다운로드 출력 카드는 기존 Flex 카드를 그대로 사용.
const WebFileMergeDescription = ({ m }) => {
  const inputs = m.inputs || [];
  const cleanTitle = (name) => (name || '').replace(/\.[^.]+$/, '');
  // 입력 파일 이름 키워드로 역할 추정
  const describeRole = (name, idx) => {
    const n = (name || '').toLowerCase();
    if (/요약|summary|abstract/.test(n))            return '보고서 상단 요약 섹션으로 반영';
    if (/보도자료|press|공지|release/.test(n))      return '본문 구조로 유지하여 상세 내용 구성';
    if (/회의|meeting|미팅/.test(n))                 return '결정사항·논의 항목을 본문에 통합';
    if (/계획|plan|proposal|제안/.test(n))           return '추진 계획·일정 섹션으로 편성';
    return idx === 0 ? '문서 개요와 주요 흐름 구성' : '상세 내용 보강 자료로 결합';
  };
  const combinedLabel = inputs.map(f => cleanTitle(f.name)).slice(0, 2).join(' + ')
    + (inputs.length > 2 ? ` 외 ${inputs.length - 2}개` : '');
  return (
    <div className="text-[14px] text-neutral-900 leading-relaxed">
      <p className="mb-5">{inputs.length}개 파일 내용을 구조적으로 통합해서 하나의 문서로 재구성했어요.</p>

      <h3 className="text-[15px] font-bold mb-3">병합 방식 <span className="text-neutral-400 font-normal">(근거 → 처리 방식)</span></h3>
      <ul className="list-disc pl-6 space-y-1.5 mb-3">
        {inputs.map((f, i) => (
          <li key={f.id || i} className="flex items-start gap-2 flex-wrap">
            <span>
              <span className="font-semibold">파일{i + 1}: "{cleanTitle(f.name)}"</span>
              <span className="text-neutral-500"> → {describeRole(f.name, i)}</span>
            </span>
            <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md bg-neutral-50 border border-neutral-200 text-[10.5px] text-neutral-500 align-middle">
              <FileText className="w-2.5 h-2.5 text-neutral-400" />
              <span className="truncate max-w-[120px]">{cleanTitle(f.name)}</span>
            </span>
          </li>
        ))}
      </ul>
      {inputs.length > 0 && (
        <p className="mb-6 text-neutral-700"><span className="text-neutral-400">→</span> <strong className="font-semibold">{combinedLabel} 구조를 결합한 형태로 통합</strong></p>
      )}

      <hr className="border-neutral-200 my-5" />

      <h3 className="text-[15px] font-bold mb-3">결과물</h3>
      <ul className="list-disc pl-6 space-y-1.5 mb-2">
        <li><span className="font-semibold">파일 형태:</span> HWPX <span className="text-neutral-500">(공용 표준 양식)</span></li>
        <li>
          <span className="font-semibold">구성:</span>
          <ol className="list-decimal pl-6 mt-1 space-y-1 text-neutral-700">
            <li>보고 개요</li>
            <li>요약 (초안)</li>
            <li>본문 (제목·배포일·본문·향후 계획 등)</li>
          </ol>
        </li>
      </ul>
    </div>
  );
};

// 템플릿/자유 양식 파일 결과 카드 위에 붙는 LLM-스타일 대화형 lead-in.
// 사용자가 입력한 항목값을 요약하고, 작성된 문서의 흐름을 한 줄로 안내한다.
const TEMPLATE_FLOW_DESC = {
  press:    '리드 문장 → 본문(추진 배경/주요 내용/향후 계획) → 문의처',
  policy:   '배경 → 추진 목표 → 추진 기간 → 주요 내용 → 기대 효과',
  meeting:  '회의명 → 일시·장소 → 참석자 → 안건 → 준비물',
  briefing: '목적 → 일시·장소 → 참석자 → 논의 주제 → 기대 사항',
  budget:   '사업명 → 총 예산 → 예산 항목 → 비고',
  free:     '핵심 정리 → 세부 내용 → 비고',
};
const WebFileResultLeadIn = ({ m }) => {
  const isFree = m.kind === 'free-file-result';
  const template = m.template;
  const v = m.values || {};
  const ph = getAllPlaceholders();
  const isReal = (val) => val && typeof val === 'string' && val.trim() && !ph.has(val);
  const entries = [];
  if (!isFree && template) {
    const fields = TEMPLATE_FIELDS[template.id] || [];
    fields.forEach(f => { if (isReal(v[f.key])) entries.push({ label: f.label, value: v[f.key] }); });
  } else if (isFree) {
    // 자유 양식은 동적 필드 — values 키를 그대로 사용
    Object.entries(v).forEach(([k, val]) => { if (isReal(val) && k !== 'ext') entries.push({ label: k, value: val }); });
  }
  const flowKey = isFree ? 'free' : (template?.id || 'free');
  const flow = TEMPLATE_FLOW_DESC[flowKey] || TEMPLATE_FLOW_DESC.free;
  const docName = isFree ? '자유 양식 초안' : `${template?.name || '문서'} 초안`;
  const allSample = entries.length === 0;
  return (
    <div className="text-[14px] text-neutral-900 leading-relaxed mb-4">
      <p className="mb-3">
        {allSample
          ? <>네, 알겠습니다. 빈 항목은 샘플 데이터로 채워서 <strong className="font-semibold">{docName}</strong>을 한 번 만들어 봤어요.</>
          : <>네, 보내주신 항목 값을 그대로 반영해서 <strong className="font-semibold">{docName}</strong>을 정리해 봤어요.</>}
      </p>
      {entries.length > 0 && (
        <>
          <p className="text-[13.5px] text-neutral-700 mb-2">반영한 값은 아래와 같아요.</p>
          <ul className="list-disc pl-6 space-y-1 mb-3 text-[13.5px]">
            {entries.map((e, i) => (
              <li key={i}><span className="text-neutral-600">{e.label}:</span> <span className="text-neutral-900">{e.value}</span></li>
            ))}
          </ul>
        </>
      )}
      <p className="text-[13.5px] text-neutral-700 mb-2">
        본문은 <strong className="font-medium text-neutral-800">{flow}</strong> 흐름으로 잡았고, 톤은 공식 발표 문서 기준(객관·중립)으로 맞췄어요.
      </p>
      <p className="text-[13.5px] text-neutral-700">
        아래에서 원문 미리보기로 내용을 한 번 확인해 보세요. 다듬고 싶은 부분이 있으면 편하게 말씀해 주시면, 항목별로 바로 반영해서 다시 정리해 드릴게요.
      </p>
    </div>
  );
};

            </ul>
          </li>
        </ul>
      </div>
      <p className="text-[13.5px] text-neutral-700 mb-3">아래에서 원문 미리보기로 확인해 보시고, 톤이나 분량·세부 표현 중 다듬고 싶은 부분이 있으면 편하게 말씀해 주세요. 항목별로 바로 반영해서 다시 정리해 드릴게요.</p>
      {/* 다운로드 카드 — 가장 마지막 */}

// 단계별 로딩 인디케이터 — 정책: 분석→검색→생성→실행. stage 변경에 따라 색/아이콘 전환.
// hasAttachment=true일 때 1단계 문구만 '첨부 내용을 포함해 요청을 수행합니다.' 로 분기.
const LoadingIndicator = ({ stage, hasAttachment, execLabel }) => {
  const styles = {
    analyze:  { ring: 'border-blue-300 border-t-blue-600',     icon: 'text-blue-600',     glyph: <Sparkles className="w-3.5 h-3.5" /> },
    search:   { ring: 'border-emerald-300 border-t-emerald-600', icon: 'text-emerald-600', glyph: <Search className="w-3.5 h-3.5" /> },
    generate: { ring: 'border-violet-300 border-t-violet-600',   icon: 'text-violet-600',  glyph: <Sparkles className="w-3.5 h-3.5" /> },
    execute:  { ring: 'border-amber-300 border-t-amber-600',     icon: 'text-amber-600',   glyph: <FileText className="w-3.5 h-3.5" /> },
  };
  const text = stage === 'analyze' ? (hasAttachment ? '첨부 내용을 포함해 요청을 수행합니다.' : '내용 분석 중...')
             : stage === 'search'   ? '데이터 검색 중...'
             : stage === 'generate' ? '답변 생성 중...'
             : stage === 'execute'  ? (execLabel || '실행 중...')
             : '';
  const s = styles[stage] || styles.analyze;
  return (
    <div data-feature="loading-indicator" className="flex items-center gap-2.5 mt-6 mb-2">
      <span className="relative w-7 h-7 flex items-center justify-center shrink-0">
        <span className={`absolute inset-0 rounded-full border-2 ${s.ring} animate-spin`} />
        <span className={s.icon}>{s.glyph}</span>
      </span>
      <span className="text-[13px] text-neutral-700">{text}</span>
    </div>
  );
};

// 더미 다운로드 헬퍼 — 프로토타입: 실제 hwpx 바이너리는 아니지만 다운로드 UX는 시연 가능
const downloadDummyFile = (filename, body = '') => {
  const content = body || `${filename}\n\n프로토타입 더미 파일입니다. 실제 환경에서는 .hwpx 파일이 다운로드됩니다.`;
  const blob = new Blob([content], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 0);
};

// 클립보드 복사 — navigator.clipboard 우선, 폴백은 임시 textarea + execCommand
const copyTextToClipboard = (text) => {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      resolve();
    } catch (e) { reject(e); }
  });
};

        ? inputs.map((f, i) => `${i + 1}. ${f.name}`).join('\n')
        : '입력 문서 목록 (없음)';
      if (mode === 'preserve') {
        // 원본 포맷 유지 — 각 파일이 별도 챕터로 들어감
        const chapters = inputs.length
          ? inputs.map((f, i) => `[${i + 1}] ${f.name}\n  · 원본 서식/표/이미지/스타일을 그대로 보존\n  · 문서 시작에 자동 챕터 표지 삽입`).join('\n\n')
          : '· 입력 문서 없음';
        return [
          { label: '제목',          text: `${q} 통합 병합본 (원본 포맷 유지)` },
          { label: '취합 대상',    text: inputList },
          { label: '병합 방식',    text: `각 문서의 서식·구조·표·이미지를 보존한 채 하나의 hwpx에 챕터 단위로 묶었습니다.` },
          { label: '챕터 구성',    text: chapters },
          { label: '비고',          text: `· 폰트/스타일은 원본 문서 설정을 따름\n· 챕터 간 페이지 구분자 자동 삽입\n· 목차는 챕터 표지를 기준으로 자동 생성` },
        ];
      }
      if (mode === 'sequential') {
        // 순서대로 단순 연결 — 페이지 이어붙이기
        let cursor = 1;
        const ranges = inputs.length
          ? inputs.map((f, i) => {
              const pages = 3 + (i % 3);
              const range = `p.${cursor} ~ p.${cursor + pages - 1}`;
              cursor += pages;
              return `[${i + 1}] ${f.name}  ·  ${range}`;
            }).join('\n')
          : '· 입력 문서 없음';
        return [
          { label: '제목',          text: `${q} 연결본` },
          { label: '취합 대상',    text: inputList },
          { label: '병합 방식',    text: `앞 문서 → 뒤 문서 순서로 페이지를 그대로 이어붙였습니다. 별도 재구성이나 형식 변환 없음.` },
          { label: '페이지 구성', text: ranges + (inputs.length ? `\n──────────────────────────────────────\n합계  ·  p.1 ~ p.${cursor - 1}` : '') },
          { label: '비고',          text: `· 문서 사이에 빈 구분 페이지 삽입 없음\n· 원본 페이지 번호는 보존되지 않음 (새 번호 자동 부여)\n· 순서 변경이 필요하면 다시 요청` },
        ];
      }
      // 기본: 내용 기준 보고서 재구성 (표 형태)
      return [
        { label: '제목',          text: `${q} 통합 취합 보고서` },
        { label: '취합 대상',    text: inputList },
        { label: '병합 방식',    text: `각 문서의 핵심 내용을 추출해 항목별 표로 정리한 통합 보고서입니다.` },
        { label: '취합 요약',    text: `총 ${inputs.length || 'N'}건의 사업 정보를 다음 항목 기준으로 정리했습니다.\n· 사업명 · 사업기간 · 주요 내용 · 예산 규모` },
        { label: '사업별 정리', text: `사업명         | 사업기간          | 주요 내용             | 예산 (백만원)\n──────────────────────────────────────────────────────────────\nA 사업          | 2026.03 ~ 06     | 인프라 고도화         |   42\nB 사업          | 2026.04 ~ 09     | 데이터 분석 체계 구축 |   85\nC 사업          | 2026.05 ~ 12     | 협업 도구 도입         |   31\n──────────────────────────────────────────────────────────────\n합계                                                            158` },
        { label: '비고',          text: `· 입력 문서 간 사업명/기간 포맷 차이는 자동 정규화됨\n· 수치 항목은 검토 후 확정 권장\n· 엑셀(xlsx) 형식 별도 출력 가능` },

    })(),

};
