  const [pendingExtAsk, setPendingExtAsk] = React.useState(null);
  // 자유 형식: ext 결정 후 다음 사용자 입력으로 문서 내용(필드값) 응답을 받기 위한 대기 상태
  const [pendingFieldAsk, setPendingFieldAsk] = React.useState(null);
  // 카드 액션 토스트 (값 복사 등)
  const [copyToast, setCopyToast] = React.useState(null);
  const showToast = (msg) => { setCopyToast(msg); setTimeout(() => setCopyToast(null), 2200); };
  const copyWithToast = (text, okMsg, failMsg = '복사에 실패했어요.') =>
    copyTextToClipboard(text).then(() => showToast(okMsg), () => showToast(failMsg));
  // 첫 query 진입 시 inline으로 렌더되는 template-suggest의 consumed 상태 — 선택 후 disable 표시용
  const [initialTplConsumed, setInitialTplConsumed] = React.useState(false);
  // setTimeout 핸들 모음 — unmount/대화 전환 시 일괄 cleanup (Bug-C)
  const timersRef = React.useRef([]);
  const schedule = (fn, ms) => {
    const id = setTimeout(() => {
      timersRef.current = timersRef.current.filter(t => t !== id);
      fn();
    }, ms);
    timersRef.current.push(id);
    return id;
  };
  const clearAllTimers = () => {
    timersRef.current.forEach(clearTimeout);
    timersRef.current = [];
  };
  React.useEffect(() => {
    clearAllTimers();
    setExtraMessages([]); setComposerValue(''); setPreview(null); setViewSource(null); setPendingExtAsk(null); setPendingFieldAsk(null); setInitialTplConsumed(false);
    if (!query) { setFirstStage(null); return clearAllTimers; }
    // 진입 시 첨부가 함께 들어왔으면, 별도 first-query 영역을 쓰지 않고
    // extraMessages 흐름으로 일관 처리 (사용자 메시지 + 로딩 → 의도별 응답)
    if (initialAttachments && initialAttachments.length > 0) {
      setFirstStage(null);
      const atts = initialAttachments;
      const mergeIntent   = detectFileMergeIntent(query);
      const summaryIntent = !mergeIntent && detectFileSummaryIntent(query);
      const genIntent     = !mergeIntent && !summaryIntent && detectFileGenIntent(query);
      const buildFinal = () => {
        if (mergeIntent) {
          const fileName = deriveMergeFilename(atts, 'report');
          return {
            kind: 'file-merge-result', userPrompt: query, inputs: atts, mergeMode: 'report',
            file: { name: fileName, size: 48 * 1024 + Math.floor(Math.random() * 16000), ext: 'hwpx' },
          };
        }
        if (summaryIntent) return { kind: 'file-summary', text: query, sourceFiles: atts };
        if (genIntent)     return { kind: 'template-suggest', userPrompt: query };
        return { kind: 'file-search', text: query, sourceFiles: atts };
      };
      const userMsg = { id: mkId(), role: 'user', text: query, attachments: atts, assistant: a };
      const loadId = mkId();
      const loadMsg = { id: loadId, role: 'assistant', kind: 'loading', stage: 'analyze', hasAttachment: true, assistant: a };
      setExtraMessages([userMsg, loadMsg]);
      schedule(() => setStage(loadId, { stage: 'search' }),   700);
      schedule(() => setStage(loadId, { stage: 'generate' }), 1600);
      schedule(() => finalize(loadId, buildFinal()), 2500);
      return clearAllTimers;
    }
    // 첨부 없는데 '다중 파일 생성(N개)' 의도면 템플릿 제안 우회 → 자유 형식으로 N개 일괄 생성
    if (initialBulk) {
      setFirstStage(null);
      let bExt = detectOutputExtension(query);
      if (!bExt || isBlockedExtension(bExt)) bExt = 'hwpx';
      const userMsg = { id: mkId(), role: 'user', text: query, attachments: [], assistant: a };
      const loadId = mkId();
      const loadMsg = { id: loadId, role: 'assistant', kind: 'loading', stage: 'analyze', assistant: a };
      setExtraMessages([userMsg, loadMsg]);
      schedule(() => setStage(loadId, { stage: 'execute', execLabel: `${initialBulk}개 파일 생성 중...` }), 800);
      schedule(() => {
        const files = pickSampleTitles(initialBulk).map(t => ({
          name: `${t}.${bExt}`, size: 24 * 1024 + Math.floor(Math.random() * 8000), ext: bExt,
        }));
        finalize(loadId, { kind: 'free-file-result', userPrompt: query, ext: bExt, files });
      }, 1800);
      return clearAllTimers;
    }
    // 첨부 없는 일반 진입 — 기존 first-stage 로딩 시퀀스 유지
    setFirstStage('analyze');
    schedule(() => setFirstStage('search'),   700);
    schedule(() => setFirstStage('generate'), 1500);
    schedule(() => setFirstStage(null),       2300);
    return clearAllTimers;
  }, [a.id, query]);
  const append = (...msgs) => setExtraMessages(prev => [...prev, ...msgs]);
  const mkId = () => 'm-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
  // 로딩 메시지 stage 전환
  const setStage = (id, patch) => setExtraMessages(prev => prev.map(m => m.id === id ? { ...m, ...patch } : m));
  // 로딩 메시지를 최종 응답으로 교체
  const finalize = (id, finalMsg) => setExtraMessages(prev => prev.map(m => m.id === id ? { ...m, ...finalMsg, role: 'assistant' } : m));

  const handleSend = (attachmentList = []) => {
    const text = composerValue.trim();
    if (!text) return;
    // 필드 응답 대기 중이면 최우선 처리 (표준/자유 양식 공통).
    // 'skip' 답이면 샘플 데이터로, 그 외 답은 parseFieldAnswer로 필드값 매핑.
    if (pendingFieldAsk) {
      const isSkip = /^(건너뛰기|건너뛸게|건너뛰어줘|스킵|skip|없어|없음|그냥|바로|샘플\s*데이터로\s*작성)$/i.test(text);
      const { template, ext, userPrompt: targetPrompt, fields } = pendingFieldAsk;
      const values = isSkip ? null : parseFieldAnswer(text, fields);
      const userMsg = { id: mkId(), role: 'user', text, attachments: [], assistant: activeAssistant };
      setExtraMessages(prev => prev
        .map(m => (m.kind === 'field-ask' && !m.consumed) ? { ...m, consumed: true } : m)
        .concat([userMsg]));
      setComposerValue('');
      setPendingFieldAsk(null);
      if (template.id === 'free') {
        // 자유 형식: 사용자가 'ext' 필드로 입력한 값이 있으면 우선, 차단 확장자면 기본(hwpx) fallback
        let finalExt = ext;
        if (values && values.ext) {
          const detected = detectOutputExtension(values.ext);
          if (detected && !isBlockedExtension(detected)) finalExt = detected;
        }
        runFreeFileGeneration(targetPrompt, finalExt || 'hwpx', values);
      } else {
        runFileGeneration(template, targetPrompt, values);
      }
      return;
    }
    // 자유 형식 ext 응답 대기 중이면 우선 처리. 블랙리스트 정책: 차단 확장자만 거부, 그 외 모두 허용.
    if (pendingExtAsk) {
      const ext = detectOutputExtension(text);
      if (ext) {
        const userMsg = { id: mkId(), role: 'user', text, attachments: [], assistant: activeAssistant };
        if (isBlockedExtension(ext)) {
          // 차단 확장자 — 안내 후 다시 받음
          const retryMsg = { id: mkId(), role: 'assistant', kind: 'ext-ask-retry', invalidInput: text, blockedExt: ext, blocked: true, userPrompt: pendingExtAsk.userPrompt, assistant: activeAssistant };
          append(userMsg, retryMsg);
          setComposerValue('');
          return;
        }
        // 정상 — 자유 형식 생성 진행
        append(userMsg);
        setComposerValue('');
        const targetPrompt = pendingExtAsk.userPrompt;
        setPendingExtAsk(null);
        askFields(FREE_TEMPLATE, targetPrompt, ext);
        return;
      }
      // ext 자체를 추출하지 못한 경우 — 다른 명확한 의도면 자유 형식 중단하고 기본 분기로 fallthrough
      const hasOtherIntent = detectFileMergeIntent(text) || detectFileSummaryIntent(text) || detectFileGenIntent(text);
      if (hasOtherIntent) {
        setPendingExtAsk(null);
        // ↓ 기본 분기 처리로 진행
      } else {
        // 한국어 위주 답변 등 — 일반 retry 안내
        const userMsg = { id: mkId(), role: 'user', text, attachments: [], assistant: activeAssistant };
        const retryMsg = { id: mkId(), role: 'assistant', kind: 'ext-ask-retry', invalidInput: text, blocked: false, userPrompt: pendingExtAsk.userPrompt, assistant: activeAssistant };
        append(userMsg, retryMsg);
        setComposerValue('');
        return;
      }
    }
    const hasAtt = attachmentList.length > 0;
    const mergeIntent   = hasAtt && detectFileMergeIntent(text);
    const summaryIntent = hasAtt && !mergeIntent && detectFileSummaryIntent(text);
    const genIntent     = !mergeIntent && !summaryIntent && detectFileGenIntent(text);
    const userMsg = { id: mkId(), role: 'user', text, attachments: attachmentList, assistant: activeAssistant };
    const loadId = mkId();
    const loadMsg = { id: loadId, role: 'assistant', kind: 'loading', stage: 'analyze', hasAttachment: hasAtt, assistant: activeAssistant };
    append(userMsg, loadMsg);
    setComposerValue('');
    // 분기 결정 (최종 응답 종류). 병합은 카드 picker 없이 default mode로 즉시 결과 생성.
    const buildFinal = () => {
      if (mergeIntent) {
        const fileName = deriveMergeFilename(attachmentList, 'report');
        return {
          kind: 'file-merge-result', userPrompt: text, inputs: attachmentList, mergeMode: 'report',
          file: { name: fileName, size: 48 * 1024 + Math.floor(Math.random() * 16000), ext: 'hwpx' },
        };
      }
      if (summaryIntent)        return { kind: 'file-summary', text, sourceFiles: attachmentList };
      if (hasAtt && !genIntent) return { kind: 'file-search', text, sourceFiles: attachmentList };
      if (genIntent) {
        // '5개 만들어줘' 류 다중 파일 요청은 템플릿 제안 없이 자유 형식으로 N개 생성
        const bulkN = !hasAtt && detectFileCount(text);
        if (bulkN) {
          let bExt = detectOutputExtension(text);
          if (!bExt || isBlockedExtension(bExt)) bExt = 'hwpx';
          const files = pickSampleTitles(bulkN).map(t => ({
            name: `${t}.${bExt}`, size: 24 * 1024 + Math.floor(Math.random() * 8000), ext: bExt,
          }));
          return { kind: 'free-file-result', userPrompt: text, ext: bExt, files };
        }
        // 확장자 + 항목값이 모두 명시된 구체 요청 → 템플릿 제안 우회 즉시 생성
        if (!hasAtt && detectDirectFileDraftIntent(text)) {
          let dExt = extractExplicitExt(text) || detectOutputExtension(text);
          if (!dExt || isBlockedExtension(dExt)) dExt = 'hwpx';
          const draft = parseDirectDraftSections(text);
          const title = extractFileTitle(text) || pickFreeSampleTitle();
          return {
            kind: 'direct-file-result',
            userPrompt: text, ext: dExt, draft,
            file: { name: `${title}.${dExt}`, size: 28 * 1024 + Math.floor(Math.random() * 10000), ext: dExt },
          };
        }
        return { kind: 'template-suggest', userPrompt: text };
      }
      return { kind: 'text', text };
    };
    schedule(() => setStage(loadId, { stage: 'search' }),   700);
    schedule(() => setStage(loadId, { stage: 'generate' }), 1600);
    schedule(() => finalize(loadId, buildFinal()), 2500);
  };

  // 템플릿 카드의 [미리보기] 버튼 — 값이 비어있는 상태의 빈 양식 미리보기 모달을 띄움
  const handleTemplatePreview = (template, userPrompt) => setPreview({ mode: 'template', template, userPrompt, emptyValues: true });
  // 템플릿 카드의 [선택] 버튼 — 미리보기 없이 바로 필드 입력 단계로 진입
  const handleTemplateDirectPick = (template, userPrompt) => {
    echoSelection(`${template.name} 선택`);
    askFields(template, userPrompt);
  };
  // 선택값을 유저 말풍선으로 한번 더 echo + 기존 template-suggest 카드를 consumed로 마킹 (inline synth 포함)
  const echoSelection = (text) => {
    const userMsg = { id: mkId(), role: 'user', text, attachments: [], assistant: activeAssistant };
    setExtraMessages(prev => prev
      .map(m => (m.kind === 'template-suggest' && !m.consumed) ? { ...m, consumed: true } : m)
      .concat([userMsg]));
    setInitialTplConsumed(true);
  };
  const handleFreePick = (userPrompt) => {
    echoSelection('자유 형식으로 작성');
    const ext = detectOutputExtension(userPrompt);
    if (ext && isBlockedExtension(ext)) {
      // 명령문에 차단 확장자가 명시된 경우 — 즉시 안내하고 다시 받기
      append({ id: mkId(), role: 'assistant', kind: 'ext-ask-retry', invalidInput: userPrompt, blockedExt: ext, blocked: true, userPrompt, assistant: activeAssistant });
      setPendingExtAsk({ userPrompt });
      return;
    }
    const validExt = (ext && !isBlockedExtension(ext)) ? ext : null;
    // 자유 형식: 프롬프트에서 문서 종류를 추론해 필드를 동적으로 구성하고, 확장자가 없으면 '파일 형식'도 함께 묻는다.
    const { fields, intro } = generateFreeFields(userPrompt, !!validExt);
    askFields(FREE_TEMPLATE, userPrompt, validExt, fields, intro);
  };
  const handleTemplateConfirm = () => {
    if (!preview) return;
    const { template, userPrompt } = preview;
    setPreview(null);
    echoSelection(`${template.name} 선택`);
    askFields(template, userPrompt);
  };
  // 양식별 필드 질의 — 표준 양식과 자유 양식 모두 동일 패턴.
  // 어시스턴트가 "필드 목록"을 안내 메시지로 보여주고, 다음 사용자 입력을 받아 parseFieldAnswer로 매핑.
  // 자유 형식은 customFields를 받아 프롬프트별 동적 항목으로 질의 (intro 텍스트도 함께 노출).
  const askFields = (template, userPrompt, ext = null, customFields = null, intro = null) => {
    const fields = customFields || (template.id === 'free' ? FREE_FIELDS : (TEMPLATE_FIELDS[template.id] || []));
    if (fields.length === 0) {
      if (template.id === 'free') runFreeFileGeneration(userPrompt, ext, null);
      else runFileGeneration(template, userPrompt, null);
      return;
    }
    append({
      id: mkId(), role: 'assistant', kind: 'field-ask',
      template, ext, fields, userPrompt, intro, consumed: false,
      assistant: activeAssistant,
    });
    setPendingFieldAsk({ template, ext, userPrompt, fields });
  };
  // 파일 생성 실행 (표준 양식) — 'generate' → 'execute(파일 생성 중...)' → file-result 카드.
  // 다중 파일 의도 감지 시 HWPX/DOCX/PDF 3종 동시 출력. 단일 출력은 HWPX 기본.
  const runFileGeneration = (template, userPrompt, values) => {
    const loadId = mkId();
    append({ id: loadId, role: 'assistant', kind: 'loading', stage: 'generate', hasAttachment: false, assistant: activeAssistant });
    schedule(() => setStage(loadId, { stage: 'execute', execLabel: '파일 생성 중...' }), 700);
    const v = values || {};
    // placeholder 그대로 들어온 값은 진짜 값이 아님 → 제외
    const ph = getAllPlaceholders();
    const isReal = (val) => val && !ph.has(val);
    const valueTitle = [v.subject, v.name, v.project, v.purpose].find(isReal);
    const promptTitle = extractFileTitle(userPrompt);
    // 프롬프트가 양식명에 포함되거나 일반어이면 샘플 풀로 fallback (length 비교로 더 긴 사용자 입력은 보존)
    const isGenericPrompt = !promptTitle
                         || promptTitle === template.name
                         || (promptTitle.length <= template.name.length && template.name.includes(promptTitle))
                         || /^(보고서|보도자료|계획서|예산서|회의록|간담회|안건지|파일|문서)$/.test(promptTitle);
    const title = valueTitle
                || (!isGenericPrompt && promptTitle)
                || pickTemplateSampleTitle(template.id)
                || promptTitle
                || `${template.name}_초안`;
    const base = 24 * 1024;
    const mk = (e) => ({ name: `${title}.${e}`, size: base + Math.floor(Math.random() * 8000), ext: e });
    if (detectMultiFileIntent(userPrompt)) {
      const files = ['hwpx', 'docx', 'pdf'].map(mk);
      schedule(() => finalize(loadId, { kind: 'file-result', template, userPrompt, values, files }), 1700);
    } else {
      schedule(() => finalize(loadId, { kind: 'file-result', template, userPrompt, values, file: mk('hwpx') }), 1700);
    }
  };
  // 자유 형식 파일 생성 — 사용자 지정 ext로 단일 생성. 다중 의도 시 ext + 보조 2종.
  const runFreeFileGeneration = (userPrompt, ext, values) => {
    const loadId = mkId();
    append({ id: loadId, role: 'assistant', kind: 'loading', stage: 'generate', hasAttachment: false, assistant: activeAssistant });
    schedule(() => setStage(loadId, { stage: 'execute', execLabel: '파일 생성 중...' }), 700);
    const v = values || {};
    const ph = getAllPlaceholders();
    const valueTitle = (v.subject && !ph.has(v.subject)) ? v.subject : null;
    const promptTitle = extractFileTitle(userPrompt);
    const isGenericPrompt = !promptTitle || /^(파일|문서|샘플)$/.test(promptTitle);
    const title = valueTitle
                || (!isGenericPrompt && promptTitle)
                || pickFreeSampleTitle();
    const base = 28 * 1024;
    const mk = (e) => ({ name: `${title}.${e}`, size: base + Math.floor(Math.random() * 10000), ext: e });
    if (detectMultiFileIntent(userPrompt)) {
      const fallback = ['hwpx', 'docx', 'pdf'].filter(e => e !== ext);
      const exts = [ext, ...fallback].slice(0, 3);
      schedule(() => finalize(loadId, { kind: 'free-file-result', userPrompt, ext, values, files: exts.map(mk) }), 1700);
    } else {
      schedule(() => finalize(loadId, { kind: 'free-file-result', userPrompt, ext, values, file: mk(ext) }), 1700);
    }
  };
  // 머지 방식 카드(merge-ask)에서 선택 — 유저 말풍선 echo + consumed 마킹 + 실제 머지 실행
  const handleMergeModePick = (m, mode) => {
    const opt = MERGE_OPTIONS.find(o => o.id === mode);
    const userMsg = { id: mkId(), role: 'user', text: `${opt?.label || mode} 선택`, attachments: [], assistant: activeAssistant };
    setExtraMessages(prev => prev
      .map(x => x.id === m.id ? { ...x, consumed: true } : x)
      .concat([userMsg]));
    runMerge(m.inputs, m.userPrompt, mode);
  };
  // 실제 머지 실행 — execute 단계 로딩 후 file-merge-result 카드
  const runMerge = (inputs, userPrompt, mode) => {
    const loadId = mkId();
    append({ id: loadId, role: 'assistant', kind: 'loading', stage: 'execute', execLabel: '문서 병합 중...', hasAttachment: true, assistant: activeAssistant });
    // 머지 결과 파일명은 항상 첨부 파일 기반으로 도출 (사용자 프롬프트는 사용 안 함 — 분석 시뮬레이션)
    const fileName = deriveMergeFilename(inputs, mode);
    schedule(() => finalize(loadId, {
      kind: 'file-merge-result', userPrompt, inputs, mergeMode: mode,
      file: { name: fileName, size: 48 * 1024 + Math.floor(Math.random() * 16000), ext: 'hwpx' },
    }), 1400);
  };

  // 파일 검색 결과의 후속 작업 버튼 핸들러
  //  · write  → 검색 결과를 바탕으로 보고서 작성 (템플릿 제안 흐름 진입)
  //  · create → 자유 형식 파일로 생성 (ext 묻기로 진입)
  //  · refine → 입력창으로 안내해 다른 키워드 재검색 유도
  const handleSearchFollowUp = (action, m) => {
    if (action === 'write') {
      append({ id: mkId(), role: 'assistant', kind: 'template-suggest', userPrompt: m.text, assistant: activeAssistant });
    } else if (action === 'create') {
      append({ id: mkId(), role: 'assistant', kind: 'ext-ask', userPrompt: m.text, assistant: activeAssistant });
      setPendingExtAsk({ userPrompt: m.text });
    } else if (action === 'refine') {
      append({ id: mkId(), role: 'assistant', kind: 'text', text: '같은 파일에서 다시 검색해 드릴게요. 아래 입력창에 다른 키워드를 입력해 주세요.', assistant: activeAssistant });
    }
  };

  // 결과 카드의 미리보기 / 다운로드 (템플릿 생성 + 머지 + 자유 형식 모두) — 다중 파일 시 특정 file을 지정해 인계
  const resolveFile = (msg, file) => file || msg.file || (msg.files && msg.files[0]);
  const openFilePreview = (msg, file) => setPreview({ mode: 'file', template: msg.template, file: resolveFile(msg, file), userPrompt: msg.userPrompt, values: msg.values });
  const openMergePreview = (msg, file) => setPreview({ mode: 'file', template: MERGE_TEMPLATE, file: resolveFile(msg, file), userPrompt: msg.userPrompt, inputs: msg.inputs, mergeMode: msg.mergeMode });
  const openFreeFilePreview = (msg, file) => setPreview({ mode: 'file', template: FREE_TEMPLATE, file: resolveFile(msg, file), userPrompt: msg.userPrompt, values: msg.values });
  const openDirectFilePreview = (msg, file) => setPreview({ mode: 'file', template: DIRECT_TEMPLATE, file: resolveFile(msg, file), userPrompt: msg.userPrompt, draft: msg.draft });
  const handleDownload = (msg, file) => { const f = resolveFile(msg, file); if (f) downloadDummyFile(f.name, `[${msg.template.name}] 초안\n\n요청: ${msg.userPrompt}\n\n프로토타입 더미 파일입니다.`); };
  const handleFreeDownload = (msg, file) => { const f = resolveFile(msg, file); if (f) downloadDummyFile(f.name, `[자유 양식 초안]\n\n요청: ${msg.userPrompt}\n\n프로토타입 더미 파일입니다.`); };
  // 구체 초안 — 파싱된 항목값을 그대로 본문에 박아넣은 더미 다운로드
  const handleDirectDownload = (msg, file) => {
    const f = resolveFile(msg, file); if (!f) return;
    const draft = msg.draft || { meta: [], sections: [] };
    const lines = [];
    lines.push(`[${f.name.replace(/\.[^.]+$/, '')}]`);
    lines.push('');
    if (draft.meta.length) {
      draft.meta.forEach(it => lines.push(`${it.label}: ${it.value}`));
      lines.push('');
    }
    draft.sections.forEach(s => {
      lines.push(`■ ${s.header}`);
      s.items.forEach((t, i) => lines.push(`  ${i + 1}) ${t}`));
      lines.push('');
    });
    lines.push('— 사용자가 입력한 항목값을 그대로 반영한 초안입니다.');
    downloadDummyFile(f.name, lines.join('\n'));
  };
  const handleMergeDownload = (msg, file) => {
    const f = resolveFile(msg, file); if (!f) return;
    const list = (msg.inputs || []).map((g, i) => `${i + 1}. ${g.name}`).join('\n');
    downloadDummyFile(f.name, `[통합 취합 보고서]\n\n요청: ${msg.userPrompt}\n\n입력 문서:\n${list}\n\n프로토타입 더미 파일입니다.`);
  };
  // 결과 메시지에서 postback의 file 파라미터로 특정 파일을 찾는 헬퍼
  const pickFile = (msg, name) => {
    const files = msg.files || (msg.file ? [msg.file] : []);
    return name ? files.find(f => f.name === name) : files[0];
  };
  // Flex 카드의 postback 액션 → 로컬 핸들러로 디스패치
  const dispatchFlexAction = (m) => (action) => {
    if (!action) return;
    if (action.type === 'uri' && action.uri) { window.open(action.uri, '_blank'); return; }
    if (action.type !== 'postback') return;
    const p = parseFlexPostback(action.data);
    switch (p.action) {
      case 'preview-template': {
        const t = TEMPLATES.find(x => x.id === p.id);
        if (t) handleTemplatePreview(t, p.prompt || m.userPrompt);
        return;
      }
      case 'pick-template': {
        const t = TEMPLATES.find(x => x.id === p.id);
        if (t) handleTemplateDirectPick(t, p.prompt || m.userPrompt);
        return;
      }
      case 'pick-free':       handleFreePick(p.prompt || m.userPrompt); return;
      case 'pick-merge':      handleMergeModePick(m, p.mode); return;
      case 'preview': {
        const f = pickFile(m, p.file);
        if (m.kind === 'direct-file-result') openDirectFilePreview(m, f);
        else if (m.kind === 'free-file-result') openFreeFilePreview(m, f);
        else if (m.kind === 'file-result') openFilePreview(m, f);
        return;
      }
      case 'preview-merge': openMergePreview(m, pickFile(m, p.file)); return;
      case 'download': {
        const f = pickFile(m, p.file);
        if (m.kind === 'direct-file-result') handleDirectDownload(m, f);
        else if (m.kind === 'free-file-result') handleFreeDownload(m, f);
        else if (m.kind === 'file-result') handleDownload(m, f);
        else if (m.kind === 'file-merge-result') handleMergeDownload(m, f);
        return;
      }
      case 'download-all': {
        const files = m.files || (m.file ? [m.file] : []);
        files.forEach((f, i) => setTimeout(() => {
          if (m.kind === 'direct-file-result') handleDirectDownload(m, f);
          else if (m.kind === 'free-file-result') handleFreeDownload(m, f);
          else if (m.kind === 'file-result') handleDownload(m, f);
          else if (m.kind === 'file-merge-result') handleMergeDownload(m, f);
        }, i * 220));
        showToast(`${files.length}개 파일 다운로드를 시작했어요.`);
        return;
      }
      case 'view-source': {
        const files = m.sourceFiles || (m.sourceFile ? [m.sourceFile] : []);
        const f = files.find(x => x.name === p.file);
        if (f) setViewSource(f);
        return;
      }
      case 'copy-summary': {
        if (m.kind !== 'file-summary') return;
        const files = m.sourceFiles || (m.sourceFile ? [m.sourceFile] : []);
        const lines = [
          files.length > 1
            ? `· ${files.length}개 문서 모두 업무 환경 변화와 외부 기관 권고에 따라 관련 정책의 재정비가 필요하며, 단계적 추진이 결론으로 제시됩니다.`
            : '· 업무 환경 변화와 외부 기관 권고로 관련 정책의 재정비 필요성이 제기되었으며, 단계적 추진이 결론으로 도출되었습니다.',
          '· 추진 과제는 기존 프로세스의 전수 진단·개선안 도출, 관계 부서 협업 체계 및 표준 운영 절차 마련, 모니터링 지표 정의·분기 점검 3가지로 구성됩니다.',
          '· 2026년 5~6월 운영팀 진단, 7~9월 사업팀 시행, 10~12월 전사 정착으로 이어지는 3단계 일정이 제시됩니다.',
          '· 운영 지표 평균 12% 개선이 예상되며, 부서 간 협업·의사결정 속도 향상과 유사 업무 영역으로의 확산이 기대 효과로 정리됩니다.',
        ].join('\n');
        copyWithToast(`[핵심 요약]\n${lines}`, '요약이 복사되었어요.');
        return;
      }
      case 'copy-search-result': {
        if (m.kind !== 'file-search') return;
        const files = m.sourceFiles || (m.sourceFile ? [m.sourceFile] : []);
        const variants = [
          `${m.text}와(과) 관련된 추진 배경 단락이 발견되었습니다. 본 자료는 정책 수립 필요성과 사회적 맥락을 다루며, 후속 실행 계획과 연결됩니다.`,
          `${m.text} 관련 단계별 추진 방안이 정리되어 있으며, 주요 마일스톤과 분기별 목표가 함께 제시되어 있습니다.`,
          `${m.text} 분야의 정량 데이터 및 평가 지표가 부록 표로 정리되어 있어 후속 분석에 활용 가능합니다.`,
        ];
        const resultLines = files.map((f, i) => `📄 ${f.name} (p.${2 + i})\n"${variants[i % variants.length]}"`).join('\n\n');
        const summaryLines = [
          `· "${m.text}"와 직접 관련된 단락이 ${files.length}개 파일 전반에서 확인되었습니다.`,
          '· 추진 배경과 정책 수립 필요성이 주요 매칭 영역이며, 단계별 실행 계획과 연결되어 있습니다.',
          '· 부록의 정량 데이터는 보조 자료로 함께 활용할 수 있어요.',
        ].join('\n');
        copyWithToast(`[검색 결과]\n${resultLines}\n\n[핵심 요약]\n${summaryLines}`, '검색 결과가 복사되었어요.');
        return;
      }
      case 'skip-fields': {
        if (m.kind !== 'field-ask' || !pendingFieldAsk) return;
        const { template, ext, userPrompt: targetPrompt } = pendingFieldAsk;
        const userMsg = { id: mkId(), role: 'user', text: '샘플 데이터로 작성', attachments: [], assistant: activeAssistant };
        setExtraMessages(prev => prev
          .map(x => (x.kind === 'field-ask' && !x.consumed) ? { ...x, consumed: true } : x)
          .concat([userMsg]));
        setPendingFieldAsk(null);
        if (template.id === 'free') runFreeFileGeneration(targetPrompt, ext || 'hwpx', null);
        else runFileGeneration(template, targetPrompt, null);
        return;
      }
      case 'copy-fields': {
        if (m.kind !== 'field-ask' || !m.fields) return;
        copyWithToast(
          m.fields.map(f => `${f.label}: ${f.placeholder}`).join('\n'),
          '필드 값이 복사되었어요. 입력창에 붙여넣어 수정해 주세요.',
          '복사에 실패했어요. 브라우저 권한을 확인해 주세요.'
        );
        return;
      }
    }
  };

  const handlePreviewDownload = () => {
    if (!preview || preview.mode !== 'file') return;
    const tpl = preview.template;
    if (tpl.id === 'merge') {
      const list = (preview.inputs || []).map((f, i) => `${i + 1}. ${f.name}`).join('\n');
      downloadDummyFile(preview.file.name, `[통합 취합 보고서]\n\n요청: ${preview.userPrompt}\n\n입력 문서:\n${list}\n\n프로토타입 더미 파일입니다.`);
    } else {
      downloadDummyFile(preview.file.name, `[${tpl.name}] 초안\n\n요청: ${preview.userPrompt}\n\n프로토타입 더미 파일입니다.`);
    }
  };
  const isWorksMate = a.id === 'works-mate';
  const greeting = isWorksMate
    ? `궁금한 점이나 찾고싶은 정보가 있으시면 무엇이든 말씀해 주세요.`
    : `안녕하세요! ${a.desc}와 관련된 답변을 드리는 서비스입니다. 궁금한 내용을 입력해주시면 빠르게 안내해드릴게요.`;
  const starters = isWorksMate ? [
    `오늘 나의 업무 내역을 주제별로 정리해줘.`,
    `오늘 나의 업무 내역을 바탕으로 할일 추천해줘.`,
    `오늘 나의 업무 내역을 일일 보고서로 작성해줘.`,
  ] : [
    `${a.name}으로 오늘 업무 시작하기`,
    `이번 주 활용 시나리오 추천받기`,
    `${a.name}으로 보고서 초안 작성`,
    `자주 묻는 질문 한 번에 정리`,
  ];
  const followUps = [
    '이 분석을 바탕으로 더 많은 질문을 해도 될까요?',
    '다른 문장으로 MBTI를 분석해 줄 수 있나요?',
    'INFP 유형에 대해 더 자세히 설명해 주세요.',
    'MBTI 유형에 따른 대화 스타일은 어떤 건가요?',
  ];
  // 종료형 답변 공통 footer — 답변 출처 / 새로고침 / 복사 + 추천 프롬프트 4개.
  const renderAnswerFooter = (msg, opts = {}) => (
    <WebAnswerFooter
      followUps={getAnswerFollowUps(msg)}
      onRefresh={() => showToast('답변을 다시 생성하고 있어요…')}
      onCopy={() => showToast('답변이 복사되었어요.')}
      onPickFollowUp={(s) => setComposerValue(s)}
      hideActions={opts.hideActions}
    />
  );
  return (
    <div className="flex h-full bg-white">
      <WebSidebar collapsible={collapsible} onGotoAssistants={onGotoAssistants || (() => {})} onResumeChat={onResumeChat || (() => {})} onNewChat={onNewChat || (() => {})} recentChats={recentChats} currentScreen={currentScreen} onStartChatWithAssistant={onStartChatWithAssistant} />
      <main className="flex-1 flex flex-col min-w-0">
        {/* 헤더 */}
        <div className="border-b border-neutral-200 px-6 py-3 flex items-center gap-3">
          <button onClick={onBack} className="w-8 h-8 rounded-lg hover:bg-neutral-100 flex items-center justify-center">
            <ArrowLeft className="w-4 h-4" />
          </button>
          <div className="flex items-center gap-2">
            <div className={`w-7 h-7 rounded-lg ${a.color} flex items-center justify-center text-sm`}>{a.icon}</div>
            <span className="text-sm font-medium text-neutral-900">{a.name}</span>
          </div>
          <div className="ml-auto flex items-center gap-0.5">
            <button onClick={onNewChat} title="새 채팅" className="w-8 h-8 rounded-lg hover:bg-neutral-100 flex items-center justify-center text-neutral-500 hover:text-neutral-900 transition">
              <Edit2 className="w-4 h-4" />
            </button>
            <button title="대화방 삭제" className="w-8 h-8 rounded-lg hover:bg-neutral-100 flex items-center justify-center text-neutral-500 hover:text-neutral-900 transition">
              <Trash2 className="w-4 h-4" />
            </button>
            <button onClick={() => setScopeOpen(v => !v)} title={scopeOpen ? '커넥터 접기' : '커넥터 펼치기'} className={`w-8 h-8 rounded-lg flex items-center justify-center transition ${scopeOpen ? 'bg-neutral-900 text-white hover:bg-neutral-700' : 'hover:bg-neutral-100 text-neutral-500 hover:text-neutral-900'}`}>
              <PanelRight className="w-4 h-4" />
            </button>
          </div>
        </div>
        <div className="flex-1 flex min-h-0">
          {/* 대화 영역 */}
          <div className="flex-1 flex flex-col min-w-0">
            <div className="flex-1 overflow-y-auto">
              <div data-feature="response" className="max-w-3xl lg:max-w-4xl xl:max-w-5xl mx-auto px-8 py-8">
                {/* 인사 — 어시스턴트 인삿말 */}
                <p className="text-[14px] text-neutral-900 leading-relaxed mb-8">{greeting}</p>

                {/* 빈 상태 — 시작 프롬프트 4개 */}
                {!hasQuery && (
                  <div className="space-y-2 mb-8">
                    {starters.map((s, i) => (
                      <button key={i} className="w-full flex items-center justify-between gap-3 px-5 py-3.5 rounded-2xl border border-neutral-200 hover:border-neutral-400 hover:bg-neutral-50 text-left text-[13px] text-neutral-800 transition">
                        <span className="flex-1">{s}</span>
                        <ChevronRight className="w-4 h-4 text-neutral-400 shrink-0" />
                      </button>
                    ))}
                  </div>
                )}

                {/* 데이터 스코프 캡션 */}
                <p className="text-center text-[12px] text-neutral-500 mb-6">전체 메시지방, 전체 게시판, 전체 메일함 내용을 기반으로 답변합니다.</p>

                {showInitialQuery && (
                  <>
                    {/* 사용자 메시지 — 페이지 진입 시점의 main assistant와의 대화 (배지 없음) */}
                    <div className="flex justify-end mb-8">
                      <div className="bg-violet-100 text-neutral-900 rounded-2xl rounded-br-md px-4 py-3 max-w-md">
                        <p className="text-[13.5px] leading-relaxed">{query}</p>
                      </div>
                    </div>
                  </>
                )}
                {/* 첫 query 진입 로딩 시뮬레이션 (첨부 없을 때만) */}
                {showInitialQuery && firstStage && (
                  <LoadingIndicator stage={firstStage} hasAttachment={false} />
                )}
                {/* 첫 query 의도 분기 — 파일 생성 의도면 템플릿 제안 카드로 인터셉트 (로딩 종료 후) */}
                {showInitialQuery && !firstStage && detectFileGenIntent(query) && detectDirectFileDraftIntent(query) && (() => {
                  let dExt = extractExplicitExt(query) || detectOutputExtension(query);
                  if (!dExt || isBlockedExtension(dExt)) dExt = 'hwpx';
                  const draft = parseDirectDraftSections(query);
                  const title = extractFileTitle(query) || pickFreeSampleTitle();
                  const synthMsg = {
                    id: 'initial-direct', kind: 'direct-file-result',
                    userPrompt: query, ext: dExt, draft,
                    file: { name: `${title}.${dExt}`, size: 32 * 1024, ext: dExt },
                  };
                  return <DirectFileResult m={synthMsg} dispatchFlexAction={dispatchFlexAction} renderAnswerFooter={renderAnswerFooter} />;
                })()}
                {showInitialQuery && !firstStage && detectFileGenIntent(query) && !detectDirectFileDraftIntent(query) && (() => {
                  const synthMsg = { kind: 'template-suggest', userPrompt: query };
                  const freeMsg = { kind: 'template-suggest-free', userPrompt: query };
                  return (
                    <div data-feature="template-suggest" style={{ opacity: initialTplConsumed ? 0.5 : 1, pointerEvents: initialTplConsumed ? 'none' : 'auto' }}>
                      <p className="text-[14px] text-neutral-900 leading-relaxed mb-1">파일 생성 요청을 받았습니다.</p>
                      <p className="text-[13px] text-neutral-500 mb-3">자주 쓰는 표준 양식을 먼저 제안드려요.</p>
                      <FlexRenderer flex={buildFlex(synthMsg)} onAction={dispatchFlexAction(synthMsg)} />
                      <p className="text-[12.5px] text-neutral-500 mt-4 mb-2">원하는 양식이 없다면 자유 형식으로 진행할 수 있어요.</p>
                      <FlexRenderer flex={buildFlex(freeMsg)} onAction={dispatchFlexAction(synthMsg)} />
                    </div>
                  );
                })()}
                {/* 첫 query — 파일 생성 의도가 아닐 때만 기존 MBTI 분석 응답 표시 (로딩 종료 후) */}
                {showInitialQuery && !firstStage && !detectFileGenIntent(query) && (
                  <>
                    <WebMBTIDemoResponse query={query} />
                    <WebAnswerFooter
                      followUps={followUps}
                      onRefresh={() => showToast('답변을 다시 생성하고 있어요…')}
                      onCopy={() => showToast('답변이 복사되었어요.')}
                      onPickFollowUp={(s) => setComposerValue(s)}
                    />
                  </>
                )}
                {/* 전환 후 보낸 추가 메시지 — kind 별 렌더 분기 */}
                {extraMessages.map(m => {
                  if (m.role === 'user') return <WebUserMessage key={m.id} m={m} />;
                  // assistant 메시지 — kind 분기
                  if (m.kind === 'loading') {
                    return (
                      <div key={m.id} className="mt-2">
                        <LoadingIndicator stage={m.stage} hasAttachment={m.hasAttachment} execLabel={m.execLabel} />
                      </div>
                    );
                  }
                  if (m.kind === 'template-suggest') {
                    const freeMsg = { kind: 'template-suggest-free', userPrompt: m.userPrompt };
                    return (
                      <div key={m.id} data-feature="template-suggest" className="mt-6" style={{ opacity: m.consumed ? 0.5 : 1, pointerEvents: m.consumed ? 'none' : 'auto' }}>
                        <p className="text-[14px] text-neutral-900 leading-relaxed mb-1">파일 생성 요청을 받았습니다.</p>
                        <p className="text-[13px] text-neutral-500 mb-3">자주 쓰는 표준 양식을 먼저 제안드려요.</p>
                        <FlexRenderer flex={buildFlex(m)} onAction={dispatchFlexAction(m)} />
                        <p className="text-[12.5px] text-neutral-500 mt-4 mb-2">원하는 양식이 없다면 자유 형식으로 진행할 수 있어요.</p>
                        <FlexRenderer flex={buildFlex(freeMsg)} onAction={dispatchFlexAction(m)} />
                      </div>
                    );
                  }
                  if (m.kind === 'field-ask') {
                    if (m.template.id === 'free') {
                      return (
                        <div key={m.id} data-feature="field-ask" className="mt-6">
                          <WebFreeFieldAskMessage m={m} />
                        </div>
                      );
                    }
                    return (
                      <div key={m.id} data-feature="field-ask" className="mt-6">
                        {m.intro && (
                          <p className="text-[13px] text-neutral-700 leading-relaxed mb-3">{m.intro}</p>
                        )}
                        <FlexCardWithCopy flex={buildFlex(m)} onAction={dispatchFlexAction(m)} copyKey="copy-fields" copyLabel="필드 값 복사하기" />
                      </div>
                    );
                  }
                  if (m.kind === 'free-response') {
                    return (
                      <div key={m.id} className="mt-6">
                        <FreeResponseContent userPrompt={m.userPrompt} />
                        {renderAnswerFooter(m)}
                      </div>
                    );
                  }
                  if (m.kind === 'ext-ask') {
                    return (
                      <div key={m.id} data-feature="ext-ask" className="mt-6 text-[14px] text-neutral-900 leading-relaxed">
                        <p className="mb-1">요청하신 "<span className="text-neutral-500">{m.userPrompt}</span>"에서 파일 형식을 찾지 못했어요.</p>
                        <p>자유 양식으로 진행할게요. 원하는 확장자를 입력해 주세요.</p>
                      </div>
                    );
                  }
                  if (m.kind === 'ext-ask-retry') {
                    if (m.blocked) {
                      return (
                        <div key={m.id} data-feature="ext-ask-retry" className="mt-6 text-[14px] text-neutral-900 leading-relaxed">
                          <p className="mb-1">"<span className="text-red-600 font-medium">.{m.blockedExt}</span>" 형식은 보안 정책에 의해 차단된 확장자예요.</p>
                          <p>다른 확장자를 입력해 주세요. <span className="text-[12.5px] text-neutral-500">(지원: HWPX · DOCX · PPTX · XLSX · PDF · HWP)</span></p>
                        </div>
                      );
                    }
                    return (
                      <div key={m.id} data-feature="ext-ask-retry" className="mt-6 text-[14px] text-neutral-900 leading-relaxed">
                        <p className="mb-1">"<span className="text-neutral-500">{m.invalidInput}</span>"는 지원하지 않는 확장자예요.</p>
                        <p>다시 한 번 원하는 확장자를 입력해 주세요. <span className="text-[12.5px] text-neutral-500">(지원: HWPX · DOCX · PPTX · XLSX · PDF · HWP)</span></p>
                      </div>
                    );
                  }
                  if (m.kind === 'free-file-result') {
                    return (
                      <div key={m.id} data-feature="free-file-result" className="mt-6">
                        <WebFileResultLeadIn m={m} />
                        <FlexRenderer flex={buildFlex(m)} onAction={dispatchFlexAction(m)} />
                        {renderAnswerFooter(m, { hideActions: true })}
                      </div>
                    );
                  }
                  if (m.kind === 'direct-file-result') {
                    return <DirectFileResult key={m.id} m={m} dispatchFlexAction={dispatchFlexAction} renderAnswerFooter={renderAnswerFooter} />;
                  }
                  if (m.kind === 'file-result') {
                    return (
                      <div key={m.id} data-feature="file-result" className="mt-6">
                        <WebFileResultLeadIn m={m} />
                        <FlexRenderer flex={buildFlex(m)} onAction={dispatchFlexAction(m)} />
                        {renderAnswerFooter(m, { hideActions: true })}
                      </div>
                    );
                  }
                  if (m.kind === 'merge-ask') {
                    return (
                      <div key={m.id} data-feature="merge-ask" className="mt-6">
                        <p className="text-[14px] text-neutral-900 leading-relaxed mb-1">
                          <strong>{m.inputs.length}개 문서</strong>를 합치는 방식을 골라주세요.
                        </p>
                        <p className="text-[12px] text-neutral-500 leading-relaxed mb-3">방식에 따라 산출물 구성이 달라집니다. 출력은 모두 <strong className="text-neutral-700">.hwpx</strong>입니다.</p>
                        {m.inputs.length > 0 && (
                          <div className="flex flex-wrap gap-1.5 mb-3">
                            {m.inputs.map(att => (
                              <span key={att.id} className="inline-flex items-center gap-1.5 px-2 py-1 rounded-lg bg-neutral-50 border border-neutral-200 text-[11.5px] text-neutral-600">
                                <FileText className="w-3 h-3 text-neutral-400 shrink-0" />
                                <span className="truncate max-w-[160px]" title={att.name}>{att.name}</span>
                              </span>
                            ))}
                          </div>
                        )}
                        <div style={{ opacity: m.consumed ? 0.5 : 1, pointerEvents: m.consumed ? 'none' : 'auto' }}>
                          <FlexRenderer flex={buildFlex(m)} onAction={dispatchFlexAction(m)} />
                        </div>
                        {m.consumed && (
                          <p className="text-[11.5px] text-neutral-400 mt-2">선택 완료된 항목입니다.</p>
                        )}
                      </div>
                    );
                  }
                  if (m.kind === 'file-merge-result') {
                    return (
                      <div key={m.id} data-feature="file-merge-result" className="mt-6">
                        <WebFileMergeDescription m={m} />
                        <div className="mt-5">
                          <FlexRenderer flex={buildFlex(m)} onAction={dispatchFlexAction(m)} />
                        </div>
                        {renderAnswerFooter(m, { hideActions: true })}
                      </div>
                    );
                  }
                  if (m.kind === 'file-summary') {
                    const files = m.sourceFiles || (m.sourceFile ? [m.sourceFile] : []);
                    return (
                      <div key={m.id} data-feature="file-summary" className="mt-6">
                        <div className="flex items-center gap-1.5 mb-2">
                          <FileText className="w-3.5 h-3.5 text-blue-600" />
                          <span className="text-[11.5px] text-neutral-500">첨부한 <strong className="text-neutral-700">{files.length}개 파일</strong>을 요약했어요.</span>
                        </div>
                        <FlexCardWithCopy flex={buildFlex(m)} onAction={dispatchFlexAction(m)} copyKey="copy-summary" copyLabel="요약 복사" />
                        {renderAnswerFooter(m)}
                      </div>
                    );
                  }
                  if (m.kind === 'file-search') {
                    const files = m.sourceFiles || (m.sourceFile ? [m.sourceFile] : []);
                    return (
                      <div key={m.id} data-feature="file-search" className="mt-6">
                        <div className="flex items-center gap-1.5 mb-2">
                          <FileText className="w-3.5 h-3.5 text-blue-600" />
                          <span className="text-[11.5px] text-neutral-500">첨부한 <strong className="text-neutral-700">{files.length}개 파일</strong> 내용을 기반으로 답변합니다.</span>
                        </div>
                        <FlexCardWithCopy flex={buildFlex(m)} onAction={dispatchFlexAction(m)} copyKey="copy-search-result" copyLabel="검색 결과 복사" />
                        {renderAnswerFooter(m)}
                      </div>
                    );
                  }
                  // kind === 'text' (기본) — 어시스턴트 텍스트 응답, 다른 어시스턴트 배지 포함
                  const different = m.assistant && m.assistant.id !== a.id;
                  return (
                    <div key={m.id} className="mt-6">
                      {different && (
                        <div className="mb-2 flex items-center gap-2">
                          <div className={`w-6 h-6 rounded-md ${m.assistant.color} flex items-center justify-center text-xs shrink-0`}>{m.assistant.icon}</div>
                          <span className="text-[12px] text-neutral-700"><span className="font-semibold">{m.assistant.name}</span><span className="text-neutral-500"> 의 응답</span></span>
                        </div>
                      )}
                      <p className="text-[14px] text-neutral-900 leading-relaxed">
                        {m.text || `${m.assistant?.name || a.name} 관점에서 정리해드릴게요.`}
                      </p>
                      {renderAnswerFooter(m)}
                    </div>
                  );
                })}
              </div>
            </div>
            {/* 입력창 — 기존 유지 */}
            <div className="border-t border-neutral-200 px-6 py-4">
              <div className="max-w-3xl lg:max-w-4xl xl:max-w-5xl mx-auto">
                {/* 커넥터 영역 접혔을 때 — 현재 선택 chip */}
                {!scopeOpen && (
                  <div className="mb-2 flex justify-center">
                    <button onClick={() => setScopeOpen(true)} className="inline-flex items-center gap-2.5 pl-3 pr-2 py-1.5 rounded-full border border-neutral-200 bg-white hover:bg-neutral-50 hover:border-neutral-300 transition shadow-sm">
                      <span className="inline-flex items-center gap-1.5 text-[12px] text-neutral-700">
                        <Sparkles className="w-3.5 h-3.5 text-violet-500" />
                        <span className="font-medium">커넥터</span>
                      </span>
                      <span className="flex items-center gap-0.5">
                        <span title="메시지" className="w-5 h-5 rounded-md bg-emerald-500 flex items-center justify-center text-white text-[11px]">💬</span>
                        <span title="메일" className="w-5 h-5 rounded-md bg-amber-500 flex items-center justify-center text-white text-[11px]">✉️</span>
                        <span title="게시판" className="w-5 h-5 rounded-md bg-violet-500 flex items-center justify-center text-white text-[11px]">📋</span>
                      </span>
                    </button>
                  </div>
                )}
                <WebComposer value={composerValue} onChange={setComposerValue} onSubmit={handleSend}
                  model="default" setModel={() => {}}
                  activeAssistant={activeAssistant} setActiveAssistant={(newA) => setActiveAssistant(newA || a)}
                  chatMode />
              </div>
            </div>
          </div>
          {/* 우측 커넥터 패널 — 헤더 토글로 접기/펼치기 */}
          {scopeOpen && <WebScopePanel />}
        </div>
      </main>
      {/* 미리보기 모달 — 템플릿 미리보기(생성 전) + 파일 미리보기(생성 후) */}
      <DocPreviewModal
        open={!!preview}
        mode={preview?.mode}
        template={preview?.template}
        file={preview?.file}
        userPrompt={preview?.userPrompt}
        inputs={preview?.inputs}
        values={preview?.values}
        mergeMode={preview?.mergeMode}
        draft={preview?.draft}
        emptyValues={preview?.emptyValues}
        onClose={() => setPreview(null)}
        onConfirm={handleTemplateConfirm}
        onDownload={handlePreviewDownload}
      />
      {/* 업로드한 원본 파일 뷰어 — file-summary "원본 미리보기" 진입 + 원본 더미 다운로드 */}
      <SourceViewerModal
        file={viewSource}
        onClose={() => setViewSource(null)}
        onDownload={(f) => { if (f) downloadDummyFile(f.name, `[원본 파일]\n\n${f.name}\n\n프로토타입 더미 파일입니다.`); }}
      />
      {/* 카드 액션 토스트 (값 복사 등) */}
      {copyToast && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl bg-neutral-900 text-white text-[12.5px] shadow-lg flex items-center gap-2">
          <span>✓</span>
          <span>{copyToast}</span>
        </div>
      )}
    </div>
  );
};


// ====== 메인 앱 (Web 전용) ======
function Prototype() {
  const [screen, setScreen] = React.useState('main');
  const [query, setQuery] = React.useState('');
  const [initialAttachments, setInitialAttachments] = React.useState([]);
  const [selectedAssistant, setSelectedAssistant] = React.useState(null);
  const [recentChats, setRecentChats] = React.useState(INITIAL_RECENT_CHATS);

  const handleSubmit = (q, assistant, attachments = []) => {
    if (!q || !q.trim()) return;
    setQuery(q);
    setInitialAttachments(attachments);
    setSelectedAssistant(assistant || null);
    setRecentChats(prev => [{
      id: 'r-' + Date.now(),
      title: q.length > 30 ? q.slice(0, 30) + '…' : q,
      assistantId: assistant?.id || 'works-mate',
      preview: q,
      time: '방금 전',
    }, ...prev]);
    setScreen('response');
  };
  const handleNewChat = () => {
    setSelectedAssistant(null);
    setQuery('');
    setInitialAttachments([]);
    setScreen('main');
  };
  const handleBack = () => {
    setScreen('main');
    setSelectedAssistant(null);
    setQuery('');
    setInitialAttachments([]);
  };
  const handleResumeChat = (chat) => {
    const a = ASSISTANTS.find(x => x.id === chat.assistantId) || null;
    setSelectedAssistant(a);
    setQuery(chat.title);
    setInitialAttachments([]);
    setScreen('response');
  };
  const handleSelectAssistant = (a, prompt) => {
    setSelectedAssistant(a);
    setQuery(prompt || '');
    setInitialAttachments([]);
    setScreen('response');
  };

  const sharedProps = {
    onResumeChat: handleResumeChat,
    onNewChat: handleNewChat,
    recentChats,
    onGotoAssistants: () => {},
    onStartChatWithAssistant: handleSelectAssistant,
    currentScreen: screen,
    collapsible: true,
  };

  let body;
  if (screen === 'response') {
    body = <WebResponse query={query} initialAttachments={initialAttachments} onBack={handleBack} assistant={selectedAssistant} {...sharedProps} />;
  } else {
    body = <WebMinimal onSubmit={handleSubmit} {...sharedProps} />;
  }

  return (
    <div className="min-h-screen bg-neutral-100 pretendard">
      <style>{PRETENDARD_CSS}</style>
      <div className="bg-white border-b border-neutral-200 sticky top-0 z-50 shadow-sm">
        <div className="max-w-7xl mx-auto px-6 py-3 flex items-center gap-6">
          <div>
            <h1 className="text-base font-semibold text-neutral-900 tracking-tight">AI Studio 채팅 기능 목업</h1>
            <p className="text-[11px] text-neutral-500">파일 생성 · 병합 · 검색 · 요약</p>
          </div>
          <div className="ml-auto flex items-center gap-2">
            <button onClick={() => setScreen('main')} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${screen === 'main' ? 'bg-neutral-900 text-white' : 'bg-neutral-100 text-neutral-600 hover:bg-neutral-200'}`}>메인</button>
            <button onClick={() => setScreen('response')} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${screen === 'response' ? 'bg-neutral-900 text-white' : 'bg-neutral-100 text-neutral-600 hover:bg-neutral-200'}`}>대화</button>
          </div>
        </div>
        <div className="max-w-7xl mx-auto px-6 pb-2">
          <p className="text-[11px] text-neutral-400">
            입력창에 자연어로 명령을 입력하세요. 파일 생성: "보도자료 작성해줘" · 파일 첨부 후 병합: 파일 2개 이상 첨부 후 "합쳐줘" · 요약: 파일 첨부 후 "요약해줘" · 검색: 파일 첨부 후 키워드 입력
          </p>
        </div>
      </div>
      <div className="bg-neutral-100 p-6">
        <div className="max-w-7xl mx-auto">
          <div className="bg-white rounded-2xl shadow-xl border border-neutral-200 overflow-hidden" style={{ height: 'calc(100vh - 200px)', minHeight: 720 }}>
            <div className="h-full flex flex-col">
              <WebGlobalHeader />
              <div className="flex-1 min-h-0">{body}</div>
            </div>
          </div>
          <p className="text-center text-[11px] text-neutral-400 mt-4">↑ 실제 클릭·입력이 가능한 인터랙티브 목업입니다.</p>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(Prototype));
</script>
</body>
</html>
