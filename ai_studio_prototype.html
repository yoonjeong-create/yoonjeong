// 파일 첨부 정책 — 보안 차단 확장자 / 최대 용량
const FILE_POLICY = {
  signature: ['bat', 'cmd', 'cpl', 'dll', 'ocx', 'exe', 'scr'],
  byName:    ['com', 'js', 'vbs', 'wsf', 'hta'],
  custom:    [],
  maxBytes:  100 * 1024 * 1024, // 기본 100MB (어드민에서 1MB~2GB 단계 선택)
};
const getFileExt = (name) => {
  const i = (name || '').lastIndexOf('.');
  return i < 0 ? '' : name.slice(i + 1).toLowerCase();
};
const checkFile = (file) => {
  const ext = getFileExt(file.name);
  if (FILE_POLICY.signature.includes(ext)) return { ok: false, ext, reason: 'signature' };
  if (FILE_POLICY.byName.includes(ext))    return { ok: false, ext, reason: 'name' };
  if (FILE_POLICY.custom.includes(ext))    return { ok: false, ext, reason: 'custom' };
  if (file.size > FILE_POLICY.maxBytes)    return { ok: false, ext, reason: 'size' };
  return { ok: true, ext };
};
const formatBytes = (bytes) => {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
};

const DRAFT_MINE_IDS = new Set(['workout', 'algo', 'eng-coach', 'idea-bot']);
const statusOf = (a) => DRAFT_MINE_IDS.has(a.id) ? 'draft' : 'public';

const greeting = (name = '정윤') => {
  const dayMap = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
  const dayIdx = new Date().getDay();
  const day = dayMap[dayIdx];
  const h = new Date().getHours();
  let timeStr = '';
  if (h < 6) timeStr = '늦은 밤이에요';
  else if (h < 12) timeStr = '좋은 아침이에요';
  else if (h < 14) timeStr = '점심 잘 챙기세요';
  else if (h < 18) timeStr = '오후에도 힘내세요';
  else if (h < 22) timeStr = '저녁 시간이네요';
  else timeStr = '오늘도 수고하셨어요';
  return { day, timeStr, name };
};

// 상대 시간 ('오늘'·'어제'·'N일 전'·'N주 전') → 'MM.DD' (오늘 기준: 2026-05-12)
const formatRecentDate = (s) => {
  if (!s) return '';
  let daysAgo = 0;
  if (s.startsWith('오늘')) daysAgo = 0;
  else if (s === '어제') daysAgo = 1;
  else {
    const dayMatch = s.match(/(\d+)일 전/);
    if (dayMatch) daysAgo = parseInt(dayMatch[1], 10);
    else {
      const weekMatch = s.match(/(\d+)주 전/);
      if (weekMatch) daysAgo = parseInt(weekMatch[1], 10) * 7;
    }
  }
  const d = new Date(2026, 4, 12);
  d.setDate(d.getDate() - daysAgo);
  return `${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
};

const WebSidebar = ({ onGotoAssistants, onResumeChat, onNewChat, onStartChatWithAssistant, recentChats, collapsible, currentScreen }) => {
  const list = recentChats || INITIAL_RECENT_CHATS;
  const [collapsed, setCollapsed] = React.useState(false);
  const [assistantsOpen, setAssistantsOpen] = React.useState(true);
  const [assistantsExpanded, setAssistantsExpanded] = React.useState(false);

  const recentAssistants = (() => {
    const seen = new Set();
    const result = [];
    list.forEach(c => {
      if (c.assistantId && !seen.has(c.assistantId)) {
        const a = ASSISTANTS.find(x => x.id === c.assistantId);
        if (a) { seen.add(c.assistantId); result.push(a); }
      }
    });
    [...ASSISTANTS].sort((a, b) => parseLastUsed(a.lastUsed) - parseLastUsed(b.lastUsed)).forEach(a => {
      if (!seen.has(a.id)) { seen.add(a.id); result.push(a); }
    });
    return result;
  })();
  const visibleAssistants = assistantsExpanded ? recentAssistants.slice(0, 7) : recentAssistants.slice(0, 5);
  const itemBase = 'flex items-center rounded-lg text-sm transition';
  const itemPad = slim ? 'justify-center w-10 h-10' : 'gap-2 px-3 py-2';
  // 현재 페이지 활성 표시
  const isAssistants = currentScreen === 'assistants';
  const activeCls = 'bg-neutral-900 text-white font-medium hover:bg-neutral-800';
  const inactiveCls = 'text-neutral-700 hover:bg-neutral-100';
  const newChatInactiveCls = 'bg-neutral-100 text-neutral-800 hover:bg-neutral-200 border border-neutral-200 font-medium';
  return (
  <aside className={`${slim ? 'w-16' : 'w-60'} border-r border-neutral-200 bg-neutral-50/50 flex flex-col py-3 ${slim ? 'px-2' : 'px-3'} gap-1 shrink-0 transition-all duration-200`}>

    {/* 나의 AI 어시스턴트 목록 (최근 사용) */}

            {visibleAssistants.map(a => (
              <button

                onClick={() => onStartChatWithAssistant && onStartChatWithAssistant(a)}

    {slim ? (
      <div data-feature="recent history-flow" className="mt-2 flex flex-col items-center gap-1 flex-1">
        <button title="이전 대화" className="w-10 h-10 rounded-lg hover:bg-neutral-100 flex items-center justify-center text-neutral-500 transition">
          <Clock className="w-4 h-4" />
        </button>
      </div>
    ) : (
      <div data-feature="recent history-flow" className="mt-3 px-1 flex-1 overflow-y-auto min-h-0">
        <p className="text-[10px] font-medium text-neutral-400 uppercase tracking-wider mb-2 px-2 flex items-center gap-1">
          <Clock className="w-3 h-3" /> 이전 대화 기록

        <div className="space-y-0.5">

                </div>
                <p className="text-[12.5px] text-neutral-800 line-clamp-2 leading-snug">{c.title}</p>
              </button>
            );
          })}
        </div>
      </div>
    )}
    {/* 사이드바 접기/펼치기 — 아이콘만 */}
    {collapsible && (
      <div className={`mt-2 pt-2 border-t border-neutral-200/70 flex ${slim ? 'justify-center' : 'justify-end'}`}>
        <button
          onClick={() => setCollapsed(!collapsed)}
          title={slim ? '사이드바 펼치기' : '사이드바 접기'}

            <line x1="9" x2="9" y1="3" y2="21"/>
            {slim

              : <path d="m16 10-3 2 3 2" />}
          </svg>
        </button>

    )}
  </aside>

};

// '오늘'·'어제'·'N일 전'·'N주 전' → days 숫자
const parseLastUsed = (s) => {
  if (!s) return 9999;
  if (s === '오늘') return 0;
  if (s === '어제') return 1;
  const dayMatch = s.match(/(\d+)일 전/);
  if (dayMatch) return parseInt(dayMatch[1], 10);
  const weekMatch = s.match(/(\d+)주 전/);
  if (weekMatch) return parseInt(weekMatch[1], 10) * 7;
  return 9999;
};

          )}

          {allSorted.length > 0 && (
            <section>
              <div className="flex items-center justify-between mb-3">
                <h2 className="text-sm font-semibold text-neutral-900">전체 어시스턴트 <span className="text-[11px] text-neutral-400 font-normal ml-1">{allSorted.length}</span></h2>
                <div className="relative">
                  <button onClick={() => setShowSort(!showSort)} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] text-neutral-700 hover:bg-neutral-100 transition border border-neutral-200">
                    <span className="font-medium">{currentSort.label}</span>
                    <ChevronDown className="w-3 h-3 text-neutral-400" />
                  </button>
                  {showSort && (
                    <div className="absolute right-0 top-full mt-1 bg-white border border-neutral-200 rounded-xl shadow-lg p-1 w-32 z-20">
                      {sortOptions.map(s => (
                        <button key={s.id} onClick={() => { setSort(s.id); setShowSort(false); }} className={`w-full text-left px-2.5 py-1.5 rounded-lg text-xs transition ${sort === s.id ? 'bg-neutral-100 text-neutral-900 font-medium' : 'text-neutral-700 hover:bg-neutral-50'}`}>
                          {s.label}
                        </button>
                      ))}
                    </div>
                  )}
                </div>
              </div>
              <div data-feature="popup card-hierarchy" className="grid grid-cols-2 gap-3">
                {allSorted.slice(0, visibleCount).map((a, i) => renderCard(a, i))}
              </div>
              {allSorted.length > visibleCount && (
                <div className="flex justify-center mt-8">
                  <button onClick={() => setVisibleCount(v => v + 10)} className="h-10 px-5 rounded-full border border-neutral-300 text-sm text-neutral-700 hover:border-neutral-900 hover:bg-neutral-50 transition inline-flex items-center gap-2">
                    더보기
                    <span className="text-[11px] text-neutral-400">{allSorted.length - visibleCount}개 남음</span>
                  </button>
                </div>
              )}
            </section>
          )}
        </div>
      )}
    </div>
  );
};

const WebScopePanel = ({ conn: controlledConn, setConn: setControlledConn } = {}) => {
  // 제어형(부모가 상태 보유) / 비제어형(내부 상태) 모두 지원
  const [internalConn, setInternalConn] = React.useState(DEFAULT_CONNECTORS);
  const conn = controlledConn || internalConn;
  const setConn = setControlledConn || setInternalConn;
  const { worksOn, worksSub, internal, external, webOn } = conn;
  const blue = '#1a73e8';

  // 상태 업데이트 헬퍼
  const setWorksOn = (val) => setConn(c => ({ ...c, worksOn: typeof val === 'function' ? val(c.worksOn) : val }));
  const tgSub = (k) => setConn(c => ({ ...c, worksSub: { ...c.worksSub, [k]: !c.worksSub[k] } }));
  const tgInt = (k) => setConn(c => ({ ...c, internal: { ...c.internal, [k]: !c.internal[k] } }));
  const setWebOn = (val) => setConn(c => ({ ...c, webOn: typeof val === 'function' ? val(c.webOn) : val }));
  const connectSvc = (k) => setConn(c => ({ ...c, external: { ...c.external, [k]: { ...c.external[k], connected: true, enabled: true, execEnabled: true, searchEnabled: true } } }));
  const disconnectSvc = (k) => setConn(c => ({ ...c, external: { ...c.external, [k]: { ...c.external[k], connected: false, enabled: false, execEnabled: false, searchEnabled: false } } }));
  const tgExtEnabled = (k) => setConn(c => { const on = !c.external[k].enabled; return { ...c, external: { ...c.external, [k]: { ...c.external[k], enabled: on, execEnabled: on, searchEnabled: on } } }; });
  const setPerm = (k, which, val) => setConn(c => { const ex = { ...c.external[k], [which]: val }; ex.enabled = !!(ex.execEnabled || ex.searchEnabled); return { ...c, external: { ...c.external, [k]: ex } }; });

const MobileScopeSheet = ({ open, scope, setScope, onClose }) => {
  const [period, setPeriod] = React.useState('전체');
  const [showPeriod, setShowPeriod] = React.useState(false);
  const [internal, setInternal] = React.useState({ naver_works: false, roger: false, clovanote: false });
  const [external, setExternal] = React.useState({
    gdrive: { name: 'Google Drive',    connected: false, enabled: false },
    gcal:   { name: 'Google Calendar', connected: false, enabled: false },
    gmail:  { name: 'Gmail',           connected: false, enabled: false },
    notion: { name: 'Notion',          connected: false, enabled: false },
    freee:  { name: 'freee',           connected: false, enabled: false },
  });
  const [webOn, setWebOn] = React.useState(true);

  const tgInt = (k) => setInternal(v => {
    const next = { ...v, [k]: !v[k] };
    if (next[k]) setWebOn(false);
    return next;
  });
  const tgExt = (k) => setExternal(v => {
    const en = !v[k].enabled;
    if (en) setWebOn(false);
    return { ...v, [k]: { ...v[k], enabled: en } };
  });
  const connect = (k) => {
    setExternal(v => ({ ...v, [k]: { ...v[k], connected: true, enabled: true } }));
    setWebOn(false);
  };
  const tgWeb = () => {
    setWebOn(v => {
      const next = !v;
      if (next) {
        setInternal({ naver_works: false, roger: false, clovanote: false });
        setExternal(ex => Object.fromEntries(Object.entries(ex).map(([k, s]) => [k, { ...s, enabled: false }])));
      }
      return next;
    });
  };

  if (!open) return null;
  const externalIds = ['gdrive', 'gcal', 'gmail', 'notion', 'freee'];
  const connectedExt = externalIds.filter(id => external[id].connected);
  const unconnectedExt = externalIds.filter(id => !external[id].connected);

  const handleConfirm = () => {
    const newScope = [];
    if (webOn) newScope.push('web');

        <div className="flex-1 overflow-y-auto">
          {/* 검색 기간 */}

            <div onClick={(e) => { e.stopPropagation(); setShowPeriod(v => !v); }} className="flex items-center justify-between px-5 py-4 cursor-pointer">

              <div className="flex items-center gap-1" style={{ color: '#5E9CFF' }}>
                <span className="text-[13px]">{period}</span>
                <ChevronRight className="w-3 h-3" />
              </div>
            </div>
            {showPeriod && (
              <div className="absolute right-4 top-12 rounded-xl shadow-lg z-50 min-w-[110px] overflow-hidden" style={{ background: '#2C2C2E' }}>
                {periodOptions.map(opt => (
                  <div key={opt} onClick={(e) => { e.stopPropagation(); setPeriod(opt); setShowPeriod(false); }}
                    className="px-4 py-3 text-[13px] cursor-pointer border-b last:border-0"
                    style={{ color: period === opt ? '#5E9CFF' : '#fff', borderColor: '#3A3A3C' }}>
                    {opt}
                  </div>
                ))}
              </div>
            )}
          </div>
          <div className="h-px" style={{ background: '#2C2C2E' }} />

          {/* NAVER 패밀리 — 토글 */}
          {[
            { k: 'naver_works', name: 'NAVER WORKS', kind: 'works' },
            { k: 'roger',       name: 'Roger',       kind: 'roger' },

          </p>
          <div className="h-px" style={{ background: '#2C2C2E' }} />

        {/* 하단 버튼 */}
        <div className="flex gap-2 px-4 pt-3.5 pb-7 border-t shrink-0" style={{ borderColor: '#2C2C2E', background: '#1C1C1E' }}>

const MobileDrawer = ({ open, onClose, recentChats, onResumeChat, onGotoAssistants, onStartChatWithAssistant }) => {
  const [assistantsOpen, setAssistantsOpen] = React.useState(true);
  const [assistantsExpanded, setAssistantsExpanded] = React.useState(false);
  if (!open) return null;
  // 최근 사용 어시스턴트 목록
  const recentAssistants = (() => {
    const seen = new Set();
    const result = [];
    (recentChats || INITIAL_RECENT_CHATS).forEach(c => {
      if (c.assistantId && !seen.has(c.assistantId)) {
        const a = ASSISTANTS.find(x => x.id === c.assistantId);
        if (a) { seen.add(c.assistantId); result.push(a); }
      }
    });
    [...ASSISTANTS].sort((a, b) => parseLastUsed(a.lastUsed) - parseLastUsed(b.lastUsed)).forEach(a => {
      if (!seen.has(a.id)) { seen.add(a.id); result.push(a); }
    });
    return result;
  })();
  const visibleAssistants = assistantsExpanded ? recentAssistants.slice(0, 7) : recentAssistants.slice(0, 5);
  return (
    <div onClick={onClose} className="absolute inset-0 bg-black/60 z-40 flex justify-end">
      <div onClick={e => e.stopPropagation()} className="w-72 h-full bg-neutral-900 rounded-l-3xl flex flex-col">

        </div>

            <Sparkles className="w-4 h-4 text-neutral-300 shrink-0" />
            <span className="text-sm text-white">어시스턴트 탐색</span>
          </button>
        </div>
        {/* 나의 AI 어시스턴트 목록 */}
        {recentAssistants.length > 0 && (
          <div className="px-3 pb-2 border-t border-neutral-800 pt-3">
            <button onClick={() => setAssistantsOpen(!assistantsOpen)} className="w-full flex items-center gap-1 px-2 py-1 rounded hover:bg-neutral-800 transition text-left">
              <ChevronDown className={`w-3 h-3 text-neutral-400 transition-transform ${assistantsOpen ? '' : '-rotate-90'}`} />
              <span className="text-[11px] font-medium text-neutral-300 flex-1">나의 AI 어시스턴트 목록</span>
            </button>
            {assistantsOpen && (
              <div className="mt-1 space-y-0.5">
                {visibleAssistants.map(a => (
                  <button
                    key={a.id}
                    onClick={() => { onClose(); onStartChatWithAssistant && onStartChatWithAssistant(a); }}
                    className="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-neutral-800 transition text-left">
                    <span className={`w-7 h-7 rounded-full ${a.color} flex items-center justify-center text-sm shrink-0`}>{a.icon}</span>
                    <span className="text-[13px] text-white truncate flex-1">{a.name}</span>
                  </button>
                ))}
                {recentAssistants.length > 5 && (
                  <button onClick={() => setAssistantsExpanded(!assistantsExpanded)} className="w-full text-center text-[11px] text-neutral-500 hover:text-neutral-300 px-2 py-1.5 rounded transition inline-flex items-center justify-center gap-0.5">
                    {assistantsExpanded ? '접기' : '더보기'}

                )}
              </div>
            )}
          </div>
        )}
        {/* 이전 대화 기록 */}
        <div className="px-5 py-2 border-t border-neutral-800 flex-1 overflow-y-auto">

// ====== Mobile Composer ======
const MobileComposer = ({ value, onChange, onSubmit, model, setModel, activeAssistant, setActiveAssistant, suggestions, onPickSuggestion, scope, setScope, onOpenScope, chatMode }) => {
  const taRef = React.useRef(null);
  const fileInputRef = React.useRef(null);
  React.useEffect(() => {
    if (!chatMode || !taRef.current) return;
    const ta = taRef.current;
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
  }, [value, chatMode]);
  const [showModel, setShowModel] = React.useState(false);
  const [showAttach, setShowAttach] = React.useState(false);
  const [showPhoto, setShowPhoto] = React.useState(false);
  const [showSwitch, setShowSwitch] = React.useState(false);
  const [showLocalFiles, setShowLocalFiles] = React.useState(false);  // 파일 → 로컬 파일 선택 시트
  const [showDriveSheet, setShowDriveSheet] = React.useState(false);  // 드라이브 → 드라이브 폴더/파일 선택 시트
  // 파일 첨부 — nw 공통 업로드 차단 정책 (signature / byName / custom / size) 적용
  const [attachments, setAttachments] = React.useState([]);
  const [fileError, setFileError] = React.useState(null);
  // 차단 토스트 4초 후 자동 해제
  React.useEffect(() => {
    if (!fileError) return;
    const t = setTimeout(() => setFileError(null), 4000);
    return () => clearTimeout(t);
  }, [fileError]);
  const removeAttachment = (id) => setAttachments(prev => prev.filter(a => a.id !== id));
  const blockMsg = (r) => ({
    signature: `보안 정책에 의해 차단된 파일 형식입니다. (.${r.ext})`,
    name:      `보안 정책에 의해 차단된 파일 형식입니다. (.${r.ext})`,
    custom:    `관리자가 차단한 파일 형식입니다. (.${r.ext})`,
    size:      `파일 1개 최대 첨부 용량(${formatBytes(FILE_POLICY.maxBytes)})을 초과했습니다.`,
  }[r.reason] || '첨부할 수 없는 파일입니다.');
  // 실제 File 객체(기기 파일/사진 picker) 검증 + 첨부
  const handleFiles = (filesLike) => {
    const files = Array.from(filesLike || []);
    if (!files.length) return;
    const accepted = [], rejected = [];
    files.forEach(f => {
      const r = checkFile(f);
      if (r.ok) accepted.push({ id: `${Date.now()}-${f.name}-${f.size}`, name: f.name, size: f.size, ext: r.ext });
      else rejected.push(r);
    });
    if (accepted.length) setAttachments(prev => [...prev, ...accepted]);
    if (rejected.length) {
      const extra = rejected.length > 1 ? ` 외 ${rejected.length - 1}개` : '';
      setFileError(blockMsg(rejected[0]) + extra);
    }
  };
  // 용량 문자열('393KB','901.1MB','22.7MB') → bytes
  const parseSizeToBytes = (s) => {
    const m = String(s || '').replace(/,/g, '').match(/([\d.]+)\s*(GB|MB|KB|B)?/i);
    if (!m) return 0;
    const u = (m[2] || 'B').toUpperCase();
    const mul = u === 'GB' ? 1024 ** 3 : u === 'MB' ? 1024 ** 2 : u === 'KB' ? 1024 : 1;
    return Math.round(parseFloat(m[1]) * mul);
  };
  // 로컬/드라이브 시트에서 고른 mock 파일 → 동일 정책으로 검증
  const handleMockPick = (item) => {
    setShowLocalFiles(false);
    setShowDriveSheet(false);
    const extByKind = { pdf: 'pdf', zip: 'zip', music: 'm4a', image: 'jpg' };
    const ext = getFileExt(item.name) || extByKind[item.kind] || 'file';
    const name = getFileExt(item.name) ? item.name : `${item.name}.${ext}`;
    const size = item.size != null ? item.size : parseSizeToBytes(item.sub);
    handleFiles([{ name, size }]);
  };
  const submitAll = () => { onSubmit(); setAttachments([]); setFileError(null); };
  const closeAll = () => { setShowModel(false); setShowAttach(false); setShowPhoto(false); setShowSwitch(false); };
  const openFilePicker = () => {
    setShowAttach(false);
    setShowPhoto(false);
    if (fileInputRef.current) {
      fileInputRef.current.value = '';
      fileInputRef.current.click();
    }
  };
  const switchList = ASSISTANTS.filter(a => a.id !== 'works-mate' && (a.category === 'mine' || a.category === 'shared')).slice(0, 6);
  const pickRandomSuggestion = () => {
    if (!suggestions || !suggestions.length) return;
    const pool = suggestions.filter(p => p !== value);
    const pick = (pool.length ? pool : suggestions)[Math.floor(Math.random() * (pool.length || suggestions.length))];
    onPickSuggestion(pick);
  };
  // 커넥터 칩 — 컬러 라운드 스퀘어 + 흰색 라인 글리프 (메신저/메일/보드/웹)
  const scopeIconMap = {
    msg: { cls: 'bg-emerald-500', glyph: (
      <svg viewBox="0 0 24 24" className="w-4 h-4" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 21l2.1-5.4A8.5 8.5 0 1 1 21 11.5z"/></svg>
    ) },
    mail: { cls: 'bg-amber-500', glyph: (
      <svg viewBox="0 0 24 24" className="w-4 h-4" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 5.5L20 7"/></svg>
    ) },
    board: { cls: 'bg-violet-500', glyph: (
      <svg viewBox="0 0 24 24" className="w-4 h-4" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="4" width="14" height="17" rx="2.5"/><rect x="9" y="2.5" width="6" height="3.5" rx="1.2"/><path d="M9 11h6M9 15h4"/></svg>
    ) },
    web: { cls: 'bg-blue-500', glyph: (
      <svg viewBox="0 0 24 24" className="w-4 h-4" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/></svg>
    ) },
  };
  const activeScopes = scope || ['msg', 'mail', 'board'];
  return (
    <div className="px-3 pb-3 pt-1 bg-neutral-900 shrink-0">
      {/* 커넥터 chip 행 */}
      {onOpenScope && (
        <button onClick={onOpenScope} className="w-full flex items-center justify-between px-3 py-2 rounded-2xl bg-neutral-800/70 border border-neutral-800 mb-2">
          <span className="inline-flex items-center gap-1.5 text-[12px] text-neutral-300">
            <span className="text-violet-400">✦</span> 커넥터
          </span>
          <span className="flex items-center gap-1.5">
            {activeScopes.filter(s => scopeIconMap[s]).map(s => (
              <span key={s} className={`w-8 h-8 rounded-[10px] ${scopeIconMap[s].cls} flex items-center justify-center`}>{scopeIconMap[s].glyph}</span>
            ))}
          </span>
        </button>
      )}
      {!chatMode && activeAssistant && (
        <div data-feature="active-assistant" className="flex items-center gap-1.5 mb-1.5 ml-1">
          <span className="text-[10px] text-neutral-500">대화 대상:</span>
          <span className="inline-flex items-center gap-1 pl-0.5 pr-1.5 py-0.5 rounded-full bg-emerald-500 text-white text-[10px] font-medium">
            <span className={`w-3.5 h-3.5 rounded-full ${activeAssistant.color} flex items-center justify-center text-[8px]`}>{activeAssistant.icon}</span>
            {activeAssistant.name}
            <button onClick={() => setActiveAssistant(null)}><X className="w-2.5 h-2.5" /></button>
          </span>
        </div>
      )}
      {/* 파일 차단 토스트 — 4초 후 자동 사라짐, [X]로 즉시 닫기 */}
      {fileError && (
        <div data-feature="file-error-toast" className="mb-2 flex items-start gap-2 px-3 py-2 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-200 text-[12px]">
          <span className="flex-1 leading-snug">{fileError}</span>
          <button onClick={() => setFileError(null)} className="shrink-0 text-rose-300 hover:text-white"><X className="w-3.5 h-3.5" /></button>
        </div>
      )}
      {/* 첨부 칩 영역 — 아이콘 + 파일명/확장자 + 용량 + 제거(X) */}
      {attachments.length > 0 && (
        <div data-feature="attach-chips" className="flex flex-wrap gap-1.5 mb-2">
          {attachments.map(a => (
            <span key={a.id} className="inline-flex items-center gap-1.5 pl-2 pr-1 py-1 rounded-lg bg-neutral-800 border border-neutral-700 text-[12px] text-neutral-200 max-w-[220px]">
              <FileText className="w-3.5 h-3.5 text-neutral-400 shrink-0" />
              <span className="truncate" title={a.name}>{a.name}</span>
              <span className="text-[10px] text-neutral-500 shrink-0">{formatBytes(a.size)}</span>
              <button onClick={() => removeAttachment(a.id)} className="w-4 h-4 rounded flex items-center justify-center text-neutral-500 hover:text-neutral-200 shrink-0"><X className="w-3 h-3" /></button>
            </span>
          ))}
        </div>
      )}
      {/* 네온 그라디언트 보더 입력창 */}
      <div data-feature="composer history-flow" className="rounded-3xl p-[1.5px] bg-gradient-to-r from-violet-500 via-fuchsia-500 to-blue-500">
      <div className="bg-neutral-900 rounded-3xl px-2 py-1">
        {/* 입력창을 X·이미지 버튼과 같은 한 줄(같은 depth)에 배치 */}
        <div className="flex items-center gap-0.5">
          {/* 파일 첨부 — 웹과 동일한 클립(Paperclip) 아이콘, 클릭 시 하단 첨부 시트 오픈 */}
          <button data-feature="attach" onClick={() => { setShowModel(false); setShowPhoto(false); setShowAttach(true); }} title="파일 첨부" className="shrink-0 w-7 h-7 rounded-full flex items-center justify-center transition text-neutral-400 hover:bg-neutral-700 hover:text-neutral-200">
            <Paperclip className="w-4 h-4" strokeWidth={2} />
          </button>
          {/* 모델 선택 — 현재 선택된 모델명 노출, 탭하면 하단 모델 시트 오픈 */}
          <button data-feature="model" onClick={() => { closeAll(); setShowModel(true); }} className="shrink-0 inline-flex items-center gap-1 px-2 py-1 rounded-full text-[11px] text-neutral-200 hover:bg-neutral-700">
            <Sparkles className="w-3.5 h-3.5 text-violet-400" />
            <span className="font-medium max-w-[84px] truncate">{(MODELS.find(m => m.id === model) || MODELS[0]).label}</span>
            <ChevronDown className="w-3 h-3 text-neutral-400" />
          </button>
          {/* 입력창 — 버튼들과 같은 줄 */}
          <textarea
            ref={taRef}
            value={value}
            onChange={e => onChange(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); submitAll(); } }}
            placeholder={activeAssistant ? `${activeAssistant.name}에게 메시지` : '인식한 정보를 포함해 요청할 내용 입력'}
            rows={1}
            className={`flex-1 min-w-0 resize-none bg-transparent border-0 outline-none px-1 py-1.5 text-[14px] text-white placeholder:text-[11px] placeholder:text-neutral-500 overflow-y-auto ${chatMode ? 'min-h-[28px] max-h-[160px]' : 'max-h-24'}`}
          />
          {/* hidden file input */}
          <input ref={fileInputRef} type="file" multiple className="hidden" onChange={(e) => { handleFiles(e.target.files); closeAll(); }} />
        </div>
      </div>
      </div>
      <p className="text-[10px] text-neutral-500 text-center mt-2">AI는 일부 부정확한 정보를 생성할 수 있습니다.</p>

      {/* 파일 첨부 액션 시트 — 아래에서 위로 올라오는 모달 */}
      {showAttach && (
        <MobileAttachSheet
          onClose={() => setShowAttach(false)}
          onPhoto={() => { setShowAttach(false); setShowPhoto(true); }}
          onFile={() => { setShowAttach(false); setShowLocalFiles(true); }}
          onDrive={() => { setShowAttach(false); setShowDriveSheet(true); }}
        />
      )}
      {/* 사진/동영상 선택 — 갤러리 바텀시트 */}
      {showPhoto && (
        <MobilePhotoSheet openFilePicker={openFilePicker} onClose={() => setShowPhoto(false)} />
      )}
      {/* 모델 선택 — 바텀시트 */}
      {showModel && (
        <MobileModelSheet model={model} setModel={setModel} onClose={() => setShowModel(false)} />
      )}

      {/* ── '파일' → 로컬(기기) 파일 선택 바텀시트 ── */}
      {showLocalFiles && (
        <MobileLocalFileSheet onClose={() => setShowLocalFiles(false)} onPick={handleMockPick} />
      )}

      {/* ── '드라이브' → 드라이브 폴더/파일 선택 바텀시트 ── */}
      {showDriveSheet && (
        <MobileDriveSheet onClose={() => setShowDriveSheet(false)} />
      )}
    </div>
  );
};

// ====== Mobile 로컬 파일 선택 시트 (기기 내 파일) ======

  const [search, setSearch] = React.useState('');

    { id: 'f1', kind: 'pdf',    name: '2023 노조 영수증',          meta: '2024. 1. 17.',  sub: '393KB' },

    { id: 'f3', kind: 'folder', name: '고용24',                    meta: '1개의 항목',    accent: '#0a84ff' },
    { id: 'f4', kind: 'pdf',    name: '기본증명서(정재하)',        meta: '2025. 6. 2.',   sub: '267KB' },
    { id: 'f5', kind: 'folder', name: '노부영 1차 구매분 리핑',     meta: '2개의 항목' },
    { id: 'f6', kind: 'zip',    name: '노부영 1차 구매분 리핑..zip', meta: '2025. 11. 17.', sub: '901.1MB' },
    { id: 'f7', kind: 'folder', name: '다운로드',                  meta: '29개의 항목',   badge: 'down' },
    { id: 'f8', kind: 'music',  name: '달님 사주',                 meta: '2023. 7. 13.',  sub: '22.7MB' },
    { id: 'f9', kind: 'folder', name: '대한항공',                  meta: '8개의 항목' },
  ];
  const list = search.trim()
    ? ITEMS.filter(i => i.name.toLowerCase().includes(search.trim().toLowerCase()))
    : ITEMS;
  const Thumb = ({ it }) => {
    if (it.kind === 'folder') {
      return (
        <div className="w-full aspect-[4/3] rounded-lg flex items-center justify-center relative" style={{ background: it.accent ? '#0a3a66' : 'transparent' }}>
          <svg viewBox="0 0 28 22" className="w-[58px] h-auto"><path d="M2 4a2 2 0 0 1 2-2h6.2a2 2 0 0 1 1.4.6L13 4h11a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z" fill="#0a84ff"/></svg>

      return (

        </div>
      );

    // pdf / zip 문서 미리보기 카드

const MobileAssistantStore = ({ onBack, onPreviewAssistant, onCreateAssistant }) => {
  const [sort, setSort] = React.useState('popular');
  const [showSort, setShowSort] = React.useState(false);
  const [mineStatus, setMineStatus] = React.useState('all');
  const [aTab, setATab] = React.useState('mine');
  const [aAllCount, setAAllCount] = React.useState(8);
  const [aMineCount, setAMineCount] = React.useState(8);
  React.useEffect(() => { setAAllCount(8); setAMineCount(8); }, [sort, mineStatus]);
  const sortOptions = [
    { id: 'popular', label: '인기순' },
    { id: 'latest',  label: '최신순' },
    { id: 'oldest',  label: '오래된순' },
  ];
  const mineStatusOptions = [
    { id: 'all',    label: '전체' },
    { id: 'public', label: '공개' },
    { id: 'draft',  label: '제작중' },
  ];
  const currentSort = sortOptions.find(s => s.id === sort) || sortOptions[0];
  const sortFn = (a, b) => {
    if (sort === 'popular') return (b.uses ?? 0) - (a.uses ?? 0);
    if (sort === 'latest')  return (a.createdDaysAgo ?? 999) - (b.createdDaysAgo ?? 999);
    if (sort === 'oldest')  return (b.createdDaysAgo ?? 0)   - (a.createdDaysAgo ?? 0);
    return 0;
  };
  const allSortedFull  = [...ASSISTANTS.filter(a => a.category !== 'mine')].sort(sortFn);
  const mineAll        = ASSISTANTS.filter(a => a.category === 'mine');
  const mineFiltered   = mineAll.filter(a => mineStatus === 'all' || statusOf(a) === mineStatus);
  const mineSortedFull = [...mineFiltered].sort(sortFn);
  return (
    <>
      <div className="h-14 bg-neutral-900 flex items-center px-4 gap-2 shrink-0 pt-3 border-b border-neutral-800">
        <button onClick={onBack} className="w-8 h-8 rounded-lg flex items-center justify-center text-neutral-400 hover:bg-neutral-800">
          <ArrowLeft className="w-5 h-5" />
        </button>
        <span className="text-sm font-medium text-white">AI 어시스턴트 탐색</span>
        <button data-feature="create-assistant" onClick={onCreateAssistant} className="ml-auto w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center text-white" title="만들기">
          <Plus className="w-5 h-5" strokeWidth={2.5} />
        </button>
      </div>
      <div className="flex-1 overflow-y-auto">
        <div className="px-4 py-4">
          {allSortedFull.length + mineAll.length === 0 ? (
            <div className="text-center py-16 text-neutral-500 text-sm">아직 등록된 어시스턴트가 없어요</div>
          ) : (
            <div className="mt-3">
              {/* 세그먼티드 탭 — 나의 어시스턴트 / 전체 어시스턴트 */}
              <div className="flex items-center gap-1 p-1 rounded-2xl bg-neutral-800/80 mb-4">
                <button onClick={() => setATab('mine')} data-feature="mine-tab" className={`flex-1 h-9 rounded-xl text-[13px] font-medium transition ${aTab === 'mine' ? 'bg-neutral-700 text-white shadow-sm' : 'text-neutral-400'}`}>
                  나의 어시스턴트 <span className="text-[10px] opacity-70 ml-0.5">{mineAll.length}</span>
                </button>
                <button onClick={() => setATab('all')} className={`flex-1 h-9 rounded-xl text-[13px] font-medium transition ${aTab === 'all' ? 'bg-neutral-700 text-white shadow-sm' : 'text-neutral-400'}`}>
                  전체 어시스턴트 <span className="text-[10px] opacity-70 ml-0.5">{allSortedFull.length}</span>
                </button>
              </div>
              {/* 나의 어시스턴트 탭 */}
              {aTab === 'mine' && (
                <div>
                  {/* 상태 pill + 정렬 드롭다운 */}
                  <div className="flex items-center justify-between gap-2 mb-3">
                    <div className="flex items-center gap-1.5 overflow-x-auto flex-1 min-w-0 pb-1" style={{ scrollbarWidth: 'none' }}>
                      {mineStatusOptions.map(s => {
                        const count = s.id === 'all' ? mineAll.length : mineAll.filter(a => statusOf(a) === s.id).length;
                        const active = mineStatus === s.id;
                        return (
                          <button key={s.id} onClick={() => setMineStatus(s.id)} className={`shrink-0 px-3 py-1.5 rounded-full text-[12px] transition ${active ? 'bg-white text-neutral-900 font-semibold' : 'bg-neutral-800 text-neutral-400'}`}>
                            {s.label} <span className={`text-[10px] ml-0.5 ${active ? 'text-neutral-500' : 'text-neutral-600'}`}>{count}</span>
                          </button>
                        );
                      })}
                    </div>
                    <div className="relative shrink-0">
                      <button onClick={() => setShowSort(!showSort)} className="inline-flex items-center gap-1 px-2 py-1 rounded-full text-[11px] text-neutral-300 hover:bg-neutral-800 border border-neutral-700">
                        <span className="font-medium">{currentSort.label}</span>
                        <ChevronDown className="w-3 h-3 text-neutral-500" />
                      </button>
                      {showSort && (
                        <div className="absolute right-0 top-full mt-1 bg-neutral-800 border border-neutral-700 rounded-xl shadow-xl p-1 w-32 z-20">
                          {sortOptions.map(s => (
                            <button key={s.id} onClick={() => { setSort(s.id); setShowSort(false); }} className={`w-full text-left px-2.5 py-1.5 rounded-lg text-xs transition ${sort === s.id ? 'bg-neutral-700 text-white font-medium' : 'text-neutral-300 hover:bg-neutral-700'}`}>
                              {s.label}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                  {mineSortedFull.length === 0 ? (
                    <div className="text-center py-12 text-neutral-500 text-[12px]">해당 상태의 어시스턴트가 없어요</div>
                  ) : (
                    <div className="space-y-2">
                      {mineSortedFull.slice(0, aMineCount).map(a => <MobileAssistantCard key={a.id} a={a} showTopic onClick={() => onPreviewAssistant(a)} />)}
                      {mineSortedFull.length > aMineCount && (
                        <button onClick={() => setAMineCount(v => v + 8)} className="w-full mt-1 h-10 rounded-full border border-neutral-700 text-[12.5px] text-neutral-300 hover:border-neutral-500 hover:bg-neutral-800 transition inline-flex items-center justify-center gap-2">
                          더보기 <span className="text-[10px] text-neutral-500">{mineSortedFull.length - aMineCount}개 남음</span>
                        </button>
                      )}
                    </div>
                  )}
                </div>
              )}
              {/* 전체 어시스턴트 탭 */}
              {aTab === 'all' && (
                <div data-feature="popup card-hierarchy">
                  <div className="flex justify-end mb-2 relative">
                    <button onClick={() => setShowSort(!showSort)} className="inline-flex items-center gap-1 px-2 py-1 rounded-full text-[11px] text-neutral-300 hover:bg-neutral-800 border border-neutral-700">
                      <span className="font-medium">{currentSort.label}</span>
                      <ChevronDown className="w-3 h-3 text-neutral-500" />
                    </button>
                    {showSort && (
                      <div className="absolute right-0 top-full mt-1 bg-neutral-800 border border-neutral-700 rounded-xl shadow-xl p-1 w-32 z-20">
                        {sortOptions.map(s => (
                          <button key={s.id} onClick={() => { setSort(s.id); setShowSort(false); }} className={`w-full text-left px-2.5 py-1.5 rounded-lg text-xs transition ${sort === s.id ? 'bg-neutral-700 text-white font-medium' : 'text-neutral-300 hover:bg-neutral-700'}`}>
                            {s.label}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                  {allSortedFull.length === 0 ? (
                    <div className="text-center py-12 text-neutral-500 text-[12px]">표시할 어시스턴트가 없어요</div>
                  ) : (
                    <div className="space-y-2">
                      {allSortedFull.slice(0, aAllCount).map(a => <MobileAssistantCard key={a.id} a={a} showTopic onClick={() => onPreviewAssistant(a)} />)}

                        <button onClick={() => setAAllCount(v => v + 8)} className="w-full mt-1 h-10 rounded-full border border-neutral-700 text-[12.5px] text-neutral-300 hover:border-neutral-500 hover:bg-neutral-800 transition inline-flex items-center justify-center gap-2">
                          더보기 <span className="text-[10px] text-neutral-500">{allSortedFull.length - aAllCount}개 남음</span>
                        </button>
                      )}
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </>
  );
};

              {/* 탭 바 */}
              <div className={`${heroPad} border-b ${mobile ? 'border-neutral-800' : 'border-neutral-200'} flex items-center gap-5`}>
                {[
                  { id: 'basic',  label: '기본 정보' },
                  { id: 'detail', label: '상세 정보' },
                  { id: 'bg',     label: '배경지식' },
                  { id: 'perm',   label: '권한' },
                ].map(t => (
                  <button key={t.id} onClick={() => setTab(t.id)} className={`py-3 text-[13px] relative transition ${tab === t.id ? `font-bold ${tName}` : `${tMuted} hover:${tName}`}`}>
                    {t.label}
                    {tab === t.id && <span className="absolute -bottom-px left-0 right-0 h-[2px] bg-blue-500" />}
                  </button>
                ))}
              </div>
              {/* 기본 정보 */}
              {tab === 'basic' && (
                <div className={`${heroPad} py-4 space-y-4`}>
                  <div className={`rounded-2xl ${mobile ? 'bg-neutral-900/40 border border-neutral-800' : 'bg-neutral-50 border border-neutral-100'} p-4 space-y-4`}>
                    <div>
                      <p className={`text-[13px] font-bold ${tValue} mb-1`}>인사말</p>
                      <p className={`text-[13px] ${tDesc} leading-relaxed`}>{detail.greeting}</p>
                    </div>
                    <div>
                      <p className={`text-[13px] font-bold ${tValue} mb-1`}>시작 질문</p>
                      <div className="space-y-1">
                        {detail.startQuestions.map((q, i) => <p key={i} className={`text-[12px] ${tDesc} leading-snug`}>• {q}</p>)}
                      </div>
                    </div>
                    <div>
                      <p className={`text-[13px] font-bold ${tValue} mb-1`}>웹 검색</p>
                      <p className={`text-[13px] ${detail.webSearch ? 'text-emerald-500 font-medium' : tDesc}`}>{detail.webSearch ? '활성' : '비활성'}</p>
                    </div>
                    <div>
                      <p className={`text-[13px] font-bold ${tValue} mb-1`}>WORKS 데이터 검색</p>
                      <p className={`text-[13px] ${tDesc}`}>{detail.worksScope}</p>
                    </div>
                  </div>
                </div>
              )}
              {/* 상세 정보 */}
              {tab === 'detail' && (
                <div className={`${heroPad} py-4 space-y-4`}>
                  <div className={`rounded-2xl ${mobile ? 'bg-neutral-900/40 border border-neutral-800' : 'bg-neutral-50 border border-neutral-100'} p-4 space-y-4`}>
                    <div>
                      <p className={`text-[13px] font-bold ${tValue} mb-1`}>역할</p>
                      <p className={`text-[13px] ${tDesc} leading-relaxed`}>{detail.role}</p>
                    </div>
                    <div>
                      <p className={`text-[13px] font-bold ${tValue} mb-1.5`}>답변 규칙</p>
                      <div className={`rounded-xl ${mobile ? 'bg-neutral-800 border border-neutral-700' : 'bg-white border border-neutral-200'} p-3`}>
                        <p className={`text-[12px] ${tDesc} leading-relaxed whitespace-pre-line`}>{detail.rules}</p>
                      </div>
                    </div>
                    <div>
                      <p className={`text-[13px] font-bold ${tValue} mb-1`}>답변 창의성</p>
                      <p className={`text-[13px] ${tDesc}`}>{detail.creativity}</p>
                    </div>
                  </div>
                </div>
              )}
              {/* 배경지식 */}
              {tab === 'bg' && (
                <div className={`${heroPad} py-4 space-y-4`}>
                  <div className={`rounded-2xl ${mobile ? 'bg-neutral-900/40 border border-neutral-800' : 'bg-neutral-50 border border-neutral-100'} p-4 space-y-3`}>
                    <p className={`text-[13px] font-bold ${tValue}`}>저장된 배경 지식</p>
                    <div className="flex items-center gap-1.5">
                      {[{ id: 'file', label: '파일' }, { id: 'mail', label: '메일' }].map(t => (
                        <button key={t.id} onClick={() => setBgTab(t.id)} className={`px-3 py-1 rounded-full text-[12px] transition ${bgTab === t.id ? (mobile ? 'bg-white text-neutral-900' : 'bg-neutral-900 text-white') : (mobile ? 'bg-neutral-800 text-neutral-400' : 'bg-white text-neutral-600 border border-neutral-200')}`}>{t.label}</button>
                      ))}
                    </div>
                    {bgTab === 'file' && (
                      <div className={`rounded-xl ${mobile ? 'bg-neutral-800/60' : 'bg-white border border-neutral-200'} divide-y ${mobile ? 'divide-neutral-700' : 'divide-neutral-100'}`}>
                        {detail.files.map((f, i) => (
                          <div key={i} className="flex items-center gap-2.5 px-3 py-2.5">
                            <span className={`w-6 h-6 rounded ${f.color} flex items-center justify-center text-xs shrink-0`}>{f.icon}</span>
                            <span className={`text-[13px] ${tValue} truncate flex-1`}>{f.name}</span>
                          </div>
                        ))}
                      </div>
                    )}
                    {bgTab === 'mail' && (
                      <div className={`text-center py-6 text-[12px] ${tMuted}`}>등록된 메일이 없습니다.</div>
                    )}
                  </div>
                  <div className={`rounded-2xl ${mobile ? 'bg-neutral-900/40 border border-neutral-800' : 'bg-neutral-50 border border-neutral-100'} p-4 space-y-3`}>
                    <p className={`text-[13px] font-bold ${tValue}`}>실시간 연동</p>
                    <div className="flex items-center gap-1.5">
                      {[{ id: 'msg', label: '메시지방' }, { id: 'board', label: '게시판' }].map(t => (
                        <button key={t.id} onClick={() => setLiveTab(t.id)} className={`px-3 py-1 rounded-full text-[12px] transition ${liveTab === t.id ? (mobile ? 'bg-white text-neutral-900' : 'bg-neutral-900 text-white') : (mobile ? 'bg-neutral-800 text-neutral-400' : 'bg-white text-neutral-600 border border-neutral-200')}`}>{t.label}</button>
                      ))}
                    </div>
                    <div className={`text-center py-6 text-[12px] ${tMuted}`}>등록된 배경지식이 없습니다.</div>
                  </div>
                </div>
              )}
              {/* 권한 */}
              {tab === 'perm' && (
                <div className={`${heroPad} py-4 space-y-4`}>
                  <div className={`rounded-2xl ${mobile ? 'bg-neutral-900/40 border border-neutral-800' : 'bg-neutral-50 border border-neutral-100'} p-4`}>
                    <p className={`text-[13px] font-bold ${tValue} mb-3`}>운영자 ({detail.admins.length}명)</p>
                    <div className={`rounded-xl ${mobile ? 'bg-neutral-800/60' : 'bg-white border border-neutral-200'} divide-y ${mobile ? 'divide-neutral-700' : 'divide-neutral-100'}`}>
                      {detail.admins.map((p, i) => (
                        <div key={i} className="flex items-center gap-2.5 px-3 py-2.5">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-semibold shrink-0 ${p.lead ? 'bg-blue-500 text-white' : (mobile ? 'border border-neutral-600 text-neutral-400' : 'border border-neutral-300 text-neutral-500')}`}>대표</span>
                          <div className={`w-7 h-7 rounded-full ${avatarBg} flex items-center justify-center text-[11px] font-semibold shrink-0`}>{p.name[0]}</div>
                          <div className="flex-1 min-w-0">
                            <p className={`text-[12.5px] ${tValue} truncate`}><span className="font-semibold">{p.name}</span> <span className={tMuted}>{p.en}</span></p>
                            <p className="text-[10.5px] truncate"><span className="text-blue-500 font-medium">{p.team}</span> <span className={tMuted}>{p.dept}</span></p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                  <div className={`rounded-2xl ${mobile ? 'bg-neutral-900/40 border border-neutral-800' : 'bg-neutral-50 border border-neutral-100'} p-4`}>
                    <p className={`text-[13px] font-bold ${tValue} mb-2`}>사용자</p>
                    <p className={`text-[12.5px] ${tDesc}`}><span className="text-blue-500 font-medium">운영자</span> - {detail.userScope}</p>
                  </div>
                  <div className={`rounded-2xl ${mobile ? 'bg-neutral-900/40 border border-neutral-800' : 'bg-neutral-50 border border-neutral-100'} p-4`}>
                    <p className={`text-[13px] font-bold ${tValue} mb-2`}>대표 운영자</p>
                    <p className={`text-[12.5px] ${tDesc}`}>{detail.admins[0].name} <span className={tMuted}>({detail.admins[0].team})</span></p>
                  </div>
                </div>
              )}
            </>
          ) : (
            <>
              {/* 통계 */}
              <div className={`${heroPad} pb-5 grid grid-cols-2 text-center gap-2`}>
                <div className={dividerCol}>
                  {topicMeta && <div className={`text-lg font-semibold ${tValue} inline-flex items-center gap-1`}><span className="text-base">{topicMeta.icon}</span></div>}
                  <div className={`text-[12px] ${tMuted} mt-1`}>{topicMeta?.label || '-'}</div>
                </div>
                <div>
                  <div className={`text-lg font-semibold ${tValue}`}>{formatUses(assistant.uses)}</div>
                  <div className={`text-[12px] ${tMuted} mt-1`}>대화</div>
                </div>
              </div>
              {/* 이렇게 시작해보세요 */}
              <div className={`${heroPad} pb-5`}>
                <h3 className={`text-base font-semibold ${tSection} mb-3`}>이렇게 시작해보세요</h3>
                <div className={mobile ? 'space-y-2' : 'grid grid-cols-2 gap-2'}>
                  {startPrompts.map((p, i) => (
                    <button key={i} onClick={() => onStartChat(assistant, p)} className={promptBtnCls}>{p}</button>
                  ))}
                </div>
              </div>
              {/* 대표 운영자 */}
              <div className={`${heroPad} pb-5`}>
                <h3 className={`text-base font-semibold ${tSection} mb-3`}>대표 운영자</h3>
                <div className="flex items-center gap-3">
                  <div className={`w-10 h-10 rounded-full ${avatarBg} flex items-center justify-center text-sm font-semibold shrink-0`}>
                    {assistant.author?.[0] || '?'}
                  </div>
                  <div className="flex-1 min-w-0">
                    <p className={`text-sm ${tValue} font-medium truncate`}>{assistant.author || '-'}</p>
                    <p className={`text-[11px] ${tMuted}`}>대표 운영자</p>
                  </div>
                </div>
              </div>
            </>
          )}
        </div>
        {/* 하단 액션 */}
        <div className={`${mobile ? 'px-4 pt-3 pb-5' : 'px-6 py-4'} ${bottomBar} flex items-center gap-2 shrink-0`}>
          {isMine ? (
            <>
              <button className={`flex-1 h-11 px-5 rounded-xl text-sm font-medium transition ${mobile ? 'bg-neutral-800 text-white hover:bg-neutral-700 border border-neutral-700' : 'bg-white text-neutral-800 hover:bg-neutral-50 border border-neutral-300'}`}>
                수정하기
              </button>
              <button onClick={() => onStartChat(assistant)} className="flex-1 h-11 px-5 rounded-xl bg-blue-500 text-white text-sm font-semibold hover:bg-blue-600 transition">
                대화하기
              </button>
            </>
          ) : (
            <button onClick={() => onStartChat(assistant)} className={startBtn}>
              대화 시작
              <ChevronRight className="w-4 h-4" />
            </button>
          )}
        </div>
      </div>
    </div>
  );
};

// ====== 메인 앱 ======
function Prototype() {
  const [platform, setPlatform] = React.useState('web');
  const [screen, setScreen] = React.useState('main');
  const [query, setQuery] = React.useState('');
  const [selectedAssistant, setSelectedAssistant] = React.useState(null);
  const [previewAssistant, setPreviewAssistant] = React.useState(null);
  const [recentChats, setRecentChats] = React.useState(INITIAL_RECENT_CHATS);

  const handleSubmit = (q, assistant) => {
    if (!q || !q.trim()) return;
    const usedAssistant = assistant || null;
    setQuery(q);
    setSelectedAssistant(usedAssistant);
    setRecentChats(prev => [
      {
        id: 'r-' + Date.now(),
        title: q.length > 30 ? q.slice(0, 30) + '…' : q,
        assistantId: usedAssistant?.id || 'works-mate',
        preview: q,
        time: '방금 전',
      },
      ...prev,
    ]);
    setScreen('response');
  };
  const handleGotoAssistants = () => setScreen('assistants');
  const handlePreviewAssistant = (a) => setPreviewAssistant(a);
  const handleSelectAssistant = (a, prompt) => {
    setSelectedAssistant(a);
    setQuery(prompt || '');
    setPreviewAssistant(null);
    setScreen('response');
  };
  const handleResumeChat = (chat) => {
    const a = ASSISTANTS.find(x => x.id === chat.assistantId) || null;
    setSelectedAssistant(a);
    setQuery(chat.title);
    setScreen('response');
  };
  const handleNewChat = () => {
    setSelectedAssistant(null);
    setQuery('');
    setPreviewAssistant(null);
    setScreen('main');
  };
  const handleBack = () => {
    setScreen('main');
    setSelectedAssistant(null);
    setQuery('');
  };

  const renderWeb = () => {
    const sharedSidebarProps = {
      onResumeChat: handleResumeChat, onNewChat: handleNewChat, recentChats,
      onGotoAssistants: handleGotoAssistants,
      onStartChatWithAssistant: handleSelectAssistant,
      currentScreen: screen,
      collapsible: true,
    };
    let body;
    if (screen === 'assistants') body = <WebAssistantStore onBack={handleBack} onPreviewAssistant={handlePreviewAssistant} {...sharedSidebarProps} />;
    else if (screen === 'response') body = <WebResponse query={query} onBack={handleBack} assistant={selectedAssistant} {...sharedSidebarProps} />;
    else body = <WebMinimal onSubmit={handleSubmit} {...sharedSidebarProps} />;
    return (
      <div className="h-full flex flex-col">
        <WebGlobalHeader />
        <div className="flex-1 min-h-0">{body}</div>
      </div>
    );
  };

  const renderMobile = () => {
    let inner;
    if (screen === 'assistants') inner = <MobileAssistantStore onBack={handleBack} onPreviewAssistant={handlePreviewAssistant} onCreateAssistant={() => setScreen('assistant-create')} onStartChatWithAssistant={handleSelectAssistant} />;
    else if (screen === 'assistant-create') inner = <MobileAssistantCreate onBack={() => setScreen('assistants')} />;
    else if (screen === 'response') inner = <MobileResponse query={query} onBack={handleBack} assistant={selectedAssistant} recentChats={recentChats} onResumeChat={handleResumeChat} onGotoAssistants={handleGotoAssistants} onNewChat={handleNewChat} onStartChatWithAssistant={handleSelectAssistant} />;
    else inner = <MobileMain onSubmit={handleSubmit} onGotoAssistants={handleGotoAssistants} onResumeChat={handleResumeChat} recentChats={recentChats} onNewChat={handleNewChat} onStartChatWithAssistant={handleSelectAssistant} />;
    return (
      <MobileFrame>
        {inner}
        {/* 모바일 — 어시스턴트 상세는 phone frame 내부 바텀시트 */}
        <AssistantDetailModal assistant={previewAssistant} onClose={() => setPreviewAssistant(null)} onStartChat={handleSelectAssistant} mobile />
      </MobileFrame>
    );
  };

  return (
    <div className="min-h-screen bg-neutral-100 pretendard">
      <style>{PRETENDARD_CSS}</style>
      {/* 컨트롤 바 */}
      <div className="bg-white border-b border-neutral-200 sticky top-0 z-50 shadow-sm">
        <div className="max-w-7xl mx-auto px-6 py-3 flex items-center gap-6 flex-wrap">
          <div>
            <h1 className="text-base font-semibold text-neutral-900 tracking-tight">AI Studio 메인화면 개편 프로토타입</h1>
            <p className="text-[11px] text-neutral-500">v1.0</p>
          </div>
          <div className="ml-auto flex items-center gap-4 flex-wrap">
            <div className="flex items-center gap-1 bg-neutral-100 rounded-xl p-1">
              <button onClick={() => { setPlatform('web'); setScreen('main'); }} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${platform === 'web' ? 'bg-white text-neutral-900 shadow-sm' : 'text-neutral-500'}`}>Web</button>
              <button onClick={() => { setPlatform('mobile'); setScreen('main'); }} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${platform === 'mobile' ? 'bg-white text-neutral-900 shadow-sm' : 'text-neutral-500'}`}>Mobile</button>
            </div>
            <div className="flex items-center gap-1 bg-neutral-100 rounded-xl p-1">
              <button onClick={() => setScreen('main')} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${screen === 'main' ? 'bg-white text-neutral-900 shadow-sm' : 'text-neutral-500'}`}>메인</button>
              <button onClick={() => setScreen('assistants')} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${screen === 'assistants' ? 'bg-white text-neutral-900 shadow-sm' : 'text-neutral-500'}`}>어시스턴트</button>
              <button onClick={() => setScreen('response')} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${screen === 'response' ? 'bg-white text-neutral-900 shadow-sm' : 'text-neutral-500'}`}>응답</button>
            </div>
          </div>
        </div>
        <div className="max-w-7xl mx-auto px-6 pb-3">
          <div className="flex items-center gap-2 text-[11px] text-neutral-500">
            <span className="font-medium text-neutral-700">현재:</span>
            <span>{platform === 'web' ? '🖥️ Web (라이트)' : '📱 Mobile (다크)'}</span>
            <span>·</span>
            <span>
              {screen === 'main' && '메인화면'}
              {screen === 'assistants' && '어시스턴트 탐색 페이지'}
              {screen === 'response' && '응답 화면'}
            </span>
          </div>
        </div>
      </div>

      {/* 캔버스 */}
      {platform === 'web' ? (
        <div className="bg-neutral-100 p-6">
          <div className="max-w-7xl mx-auto">
            <div className="bg-white rounded-2xl shadow-xl border border-neutral-200 overflow-hidden" style={{ height: '720px' }}>
              {renderWeb()}
            </div>
            <p className="text-center text-[11px] text-neutral-400 mt-4">↑ 이 화면은 실제 클릭·입력이 가능합니다. 입력창에 텍스트 입력 후 전송 버튼을 누르거나 Enter를 치세요.</p>
          </div>
        </div>
      ) : (
        <div className="py-10">
          <div className="max-w-7xl mx-auto px-6 flex flex-col items-center gap-4">
            {renderMobile()}
            <p className="text-center text-[11px] text-neutral-400 mt-2 max-w-md">↑ Mobile 다크모드. 입력·탭 모두 가능합니다.</p>
          </div>
        </div>
      )}

      {/* 어시스턴트 상세 — Web 한정 (모바일은 MobileFrame 내부에 렌더) */}
      {platform === 'web' && <AssistantDetailModal assistant={previewAssistant} onClose={() => setPreviewAssistant(null)} onStartChat={handleSelectAssistant} />}
    </div>
  );
}


// 마운트
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(Prototype));
</script>
</body>
</html>
